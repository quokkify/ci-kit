_min_copier_version: "9.19.1"
_subdirectory: "{% if module == 'legacy' %}template{% else %}modules/{{ module }}/template{% endif %}"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
# The answers file already in the destination: empty on a fresh copy, the
# stored answers on update. Lets the handed_off default tell a missing key in
# stored answers apart from a fresh copy.
_external_data:
  stored_answers: "{{ _copier_conf.answers_file }}"
_exclude:
  # Rendered before file generation: Copier's --defaults does not validate
  # retained question defaults and can discard invalid boolean answers. Skip
  # the inherited guard in Copier's old-template scratch render; the current
  # template evaluates its own exclusions with no inherited guard marker.
  - >-
    {% set selected_release = _copier_answers.get('_commit', '') %}
    {% if '__allure_pin_mismatch__' not in (_copier_conf.exclude | join(' ')) and allure_report and (selected_release | regex_search('^v[0-9]+\\.[0-9]+\\.[0-9]+$')) and toolkit_version != selected_release %}
    {{ _copier_conf['__allure_pin_mismatch__'] | mandatory('Allure reusable workflows require the selected toolkit release. Retry with --data toolkit_version=' ~ selected_release) }}
    {% endif %}
  # Legacy no longer renders validate.yml; the core module owns it. Rendering
  # legacy without the handoff would silently drop the repository's Validate
  # workflow, so refuse instead. This guard fires first when updating from a
  # template that still rendered validate.yml; the handed_off validator fires
  # on copies and on later updates.
  - >-
    {% if module == 'legacy' and 'validate' not in (handed_off | default([])) %}
    {{ _copier_conf['__legacy_validate_removed__'] | mandatory('CIK-LEGACY-006: the legacy template no longer renders validate.yml. Hand validate off to the core module first; see docs/errors/CIK-LEGACY-006.md') }}
    {% endif %}
  # Legacy also stops rendering the files of every area handed off to a
  # module (tools/ci_kit/handoff.py AREAS). Module templates render some of
  # the same paths, so these guards apply to the legacy template only.
  - "{% if module == 'legacy' and 'base' in (handed_off | default([])) %}.github/workflows/copier-update.yml{% endif %}"
  - "{% if module == 'legacy' and 'base' in (handed_off | default([])) %}docs/ci-kit.md{% endif %}"
  - "{% if module == 'legacy' and 'base' in (handed_off | default([])) %}/README.md{% endif %}"
  - "{% if module == 'legacy' and 'base' in (handed_off | default([])) %}.github/pull_request_template.md{% endif %}"
  - "{% if module == 'legacy' and (not renovate or 'renovate' in (handed_off | default([]))) %}.github/renovate.json{% endif %}"
  - "{% if module == 'legacy' and (not release_please or 'release' in (handed_off | default([]))) %}.github/workflows/release.yml{% endif %}"
  - "{% if module == 'legacy' and (not release_please or 'release' in (handed_off | default([]))) %}.github/release-please/config.json{% endif %}"
  - "{% if module == 'legacy' and (not release_please or 'release' in (handed_off | default([]))) %}.github/release-please/manifest.json{% endif %}"
  - "{% if module == 'legacy' and (not release_please or 'release' in (handed_off | default([]))) %}.github/scripts/enrich_release_notes.py{% endif %}"
  - "{% if module == 'legacy' and (not codeql or 'security' in (handed_off | default([]))) %}.github/workflows/codeql.yml{% endif %}"
  - "{% if module == 'legacy' and (not gitleaks or 'security' in (handed_off | default([]))) %}.github/workflows/gitleaks.yml{% endif %}"
  - "{% if module == 'legacy' and (not allure_report or 'allure' in (handed_off | default([]))) %}.github/allure/allurerc.mjs{% endif %}"
  - "{% if module == 'legacy' and (not allure_report or 'allure' in (handed_off | default([]))) %}.github/allure/safe_extract.py{% endif %}"
  - "{% if module == 'legacy' and (not allure_report or 'allure' in (handed_off | default([]))) %}.github/workflows/allure-report.yml{% endif %}"
  # The security module renders each workflow only when its flag is set.
  - "{% if module == 'security' and not codeql %}.github/workflows/codeql.yml{% endif %}"
  - "{% if module == 'security' and not gitleaks %}.github/workflows/gitleaks.yml{% endif %}"

# Written once when the project is generated, then owned by the project.
# The template ships a starter README and a minimal Renovate config; real
# projects rewrite the README and extend the Renovate config with their own
# managers and rules, so a later `copier update` must not overwrite either.
# Toolkit-owned Renovate policy reaches these projects through the shared
# preset in `extends`, not by rewriting the file. The release module renders
# the same release-please starter files at the same paths.
_skip_if_exists:
  - /README.md
  - .github/renovate.json
  - .github/release-please/config.json
  - .github/release-please/manifest.json
  - .github/pull_request_template.md

module:
  type: str
  help: Template module to apply. legacy keeps the single combined template.
  choices: [legacy, core, java, python, node, docker, security, release, allure, renovate]
  default: legacy

project_name:
  when: "{{ module in ['legacy', 'core', 'allure'] }}"
  type: str
  help: Human-readable project name.
  default: my-project

toolkit_version:
  when: "{{ module in ['legacy', 'core', 'security', 'release', 'allure'] }}"
  type: str
  help: Immutable ci-kit SemVer tag used by generated workflows.
  # Fresh copies use the selected immutable template tag, including Copier's
  # automatic latest-tag selection. Existing answers still take precedence.
  default: "{{ _copier_answers.get('_commit', '') if (_copier_answers.get('_commit', '') | regex_search('^v[0-9]+\\.[0-9]+\\.[0-9]+$')) else 'v3.9.0' }}"
  validator: "{% if not (toolkit_version | regex_search('^v[0-9]+\\.[0-9]+\\.[0-9]+$')) %}Use an exact tag such as v3.9.0{% endif %}"

components:
  when: "{{ module == 'legacy' }}"
  type: yaml
  help: "Required component mappings such as [{type: python, path: backend, id: backend-python, name: Backend Python, allure_results_path: allure-results}]. id is the stable GitHub Actions job identifier and name is its display name. The Allure path is optional, component-relative, and defaults to allure-results. Supported types: python, node, java."
  # On update, retain the prior value long enough for its required identity
  # validation to fail closed; never replace a legacy topology with defaults.
  default: >-
    {% if _commit is defined and components is defined %}{{ components }}{% else %}[{type: python, path: ., id: app-python, name: Application Python}]{% endif %}
  validator: >-
    {% for component in components %}
    {% if component is not mapping %}Every component must be a mapping with type, path, id, and name.{% else %}
    {% if component.type not in ['python', 'node', 'java'] %}Unsupported component type: {{ component.type }}.{% endif %}
    {% if component.path is not string or not component.path | trim %}Every component requires a non-empty string path.{% endif %}
    {% if component.id is not string or not (component.id | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}Every component requires an id matching ^[A-Za-z_][A-Za-z0-9_-]*$.{% endif %}
    {% if component.name is not string or not (component.name | trim) %}Every component requires a non-empty string name.{% endif %}
    {% if component.id in ['template-contract', 'docker', 'release', 'update', 'scan', 'analyze', 'resolve', 'generate', 'comment', 'pages', 'changes', 'integration'] %}Component id {{ component.id }} conflicts with a generated job id.{% endif %}
    {% set component_state = namespace(ids=[]) %}
    {% for candidate in components[:loop.index] %}{% if candidate is mapping and candidate.id is string %}{% set component_state.ids = component_state.ids + [candidate.id] %}{% endif %}{% endfor %}
    {% if component_state.ids | select('equalto', component.id) | list | length > 1 %}Component ids must be unique: {{ component.id }}.{% endif %}
    {% set allure_path = component.get('allure_results_path', 'allure-results') %}
    {% if allure_path is not string or not (allure_path | trim) %}allure_results_path must be a non-empty string.{% elif not (allure_path | regex_search('^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$')) or '.' in allure_path.split('/') or '..' in allure_path.split('/') %}allure_results_path must be a safe component-relative path without traversal or globs.{% endif %}
    {% endif %}
    {% endfor %}

java_components:
  when: "{{ module == 'java' }}"
  type: yaml
  help: "Java components such as [{id: backend-java, name: Backend Java, path: backend, java_version: \"21\"}]. id is the stable GitHub Actions job identifier and name is its display name. java_version: 17, 21 or 25."
  default: >-
    {% if _commit is defined and java_components is defined %}{{ java_components }}{% else %}[{id: app-java, name: Application Java, path: ., java_version: "21"}]{% endif %}
  validator: >-
    {% set allowed_keys = ['build_command', 'build_tool', 'cache_dependencies', 'cache_jdk', 'distribution', 'gradle_console', 'id', 'install_command', 'java_version', 'lint_command', 'name', 'path', 'run_build', 'run_lint', 'run_tests', 'test_artifact_name', 'test_artifact_path', 'test_command', 'timeout_minutes', 'upload_test_artifacts'] %}
    {% if java_components is string or java_components is mapping or java_components is not sequence or not java_components %}java_components must be a non-empty YAML list of mappings.{% else %}
    {% set java_state = namespace(ids=[], names=[]) %}
    {% for component in java_components %}
    {% if component is not mapping %}Every java component must be a mapping with id, name, path, and java_version.{% else %}
    {% if component.id is not string or not (component.id | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}Every component requires an id matching ^[A-Za-z_][A-Za-z0-9_-]*$.{% endif %}
    {% if component.id in ['plan', 'core-checks', 'java', 'gate'] %}Component id {{ component.id }} conflicts with a generated job id.{% endif %}
    {% if component.id in java_state.ids %}Component ids must be unique: {{ component.id }}.{% endif %}
    {% if component.id is string %}{% set java_state.ids = java_state.ids + [component.id] %}{% endif %}
    {% if component.name is not string or not (component.name | trim) %}Every component requires a non-empty string name.{% endif %}
    {% if component.name is string and component.name in java_state.names %}Component names must be unique: {{ component.name }}.{% endif %}
    {% if component.name is string %}{% set java_state.names = java_state.names + [component.name] %}{% endif %}
    {% if component.path is not string or not (component.path | trim) %}Every component requires a non-empty string path.{% elif '..' in component.path.split('/') or (component.path | regex_search('[*?\\[]')) %}Component path must not contain .. segments or glob characters.{% endif %}
    {% if (component.java_version | string) not in ['17', '21', '25'] %}java_version must be one of 17, 21, 25.{% endif %}
    {% for key, value in component.items() %}
    {% if key not in allowed_keys %}Unsupported component key: {{ key }}.{% elif key.endswith('_version') and key != 'java_version' and value is not string %}{{ key }} must be a string such as "24".{% endif %}
    {% endfor %}
    {% endif %}
    {% endfor %}
    {% endif %}

python_components:
  when: "{{ module == 'python' }}"
  type: yaml
  help: "Python components such as [{id: backend-python, name: Backend Python, path: backend}]. id is the stable GitHub Actions job identifier and name is its display name. Optional keys mirror the python-ci workflow inputs in snake_case; every *_version must be a non-empty string."
  default: >-
    {% if _commit is defined and python_components is defined %}{{ python_components }}{% else %}[{id: app-python, name: Application Python, path: ., python_version: "3.14"}]{% endif %}
  validator: >-
    {% set allowed_keys = ['build_command', 'cache_dependencies', 'id', 'install_command', 'lint_command', 'name', 'package_manager', 'path', 'pip_version', 'poetry_version', 'python_version', 'requirements_file', 'run_build', 'run_lint', 'run_tests', 'test_artifact_name', 'test_artifact_path', 'test_command', 'timeout_minutes', 'upload_test_artifacts', 'uv_version'] %}
    {% if python_components is string or python_components is mapping or python_components is not sequence or not python_components %}python_components must be a non-empty YAML list of mappings.{% else %}
    {% set python_state = namespace(ids=[], names=[]) %}
    {% for component in python_components %}
    {% if component is not mapping %}Every python component must be a mapping with id, name, and path.{% else %}
    {% if component.id is not string or not (component.id | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}Every component requires an id matching ^[A-Za-z_][A-Za-z0-9_-]*$.{% endif %}
    {% if component.id in python_state.ids %}Component ids must be unique: {{ component.id }}.{% endif %}
    {% if component.id is string %}{% set python_state.ids = python_state.ids + [component.id] %}{% endif %}
    {% if component.name is not string or not (component.name | trim) %}Every component requires a non-empty string name.{% endif %}
    {% if component.name is string and component.name in python_state.names %}Component names must be unique: {{ component.name }}.{% endif %}
    {% if component.name is string %}{% set python_state.names = python_state.names + [component.name] %}{% endif %}
    {% if component.path is not string or not (component.path | trim) %}Every component requires a non-empty string path.{% elif '..' in component.path.split('/') or (component.path | regex_search('[*?\\[]')) %}Component path must not contain .. segments or glob characters.{% endif %}
    {% for key, value in component.items() %}
    {% if key not in allowed_keys %}Unsupported component key: {{ key }}.{% elif key.endswith('_version') and (value is not string or not (value | trim)) %}{{ key }} must be a non-empty string such as "24".{% endif %}
    {% endfor %}
    {% endif %}
    {% endfor %}
    {% endif %}

node_components:
  when: "{{ module == 'node' }}"
  type: yaml
  help: "Node components such as [{id: backend-node, name: Backend Node, path: backend}]. id is the stable GitHub Actions job identifier and name is its display name. Optional keys mirror the node-ci workflow inputs in snake_case; every *_version must be a non-empty string."
  default: >-
    {% if _commit is defined and node_components is defined %}{{ node_components }}{% else %}[{id: app-node, name: Application Node, path: ., node_version: "22"}]{% endif %}
  validator: >-
    {% set allowed_keys = ['build_command', 'cache_dependencies', 'corepack_version', 'id', 'install_command', 'lint_command', 'name', 'node_version', 'package_manager', 'path', 'run_build', 'run_lint', 'run_tests', 'test_artifact_name', 'test_artifact_path', 'test_command', 'timeout_minutes', 'upload_test_artifacts'] %}
    {% if node_components is string or node_components is mapping or node_components is not sequence or not node_components %}node_components must be a non-empty YAML list of mappings.{% else %}
    {% set node_state = namespace(ids=[], names=[]) %}
    {% for component in node_components %}
    {% if component is not mapping %}Every node component must be a mapping with id, name, and path.{% else %}
    {% if component.id is not string or not (component.id | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}Every component requires an id matching ^[A-Za-z_][A-Za-z0-9_-]*$.{% endif %}
    {% if component.id in node_state.ids %}Component ids must be unique: {{ component.id }}.{% endif %}
    {% if component.id is string %}{% set node_state.ids = node_state.ids + [component.id] %}{% endif %}
    {% if component.name is not string or not (component.name | trim) %}Every component requires a non-empty string name.{% endif %}
    {% if component.name is string and component.name in node_state.names %}Component names must be unique: {{ component.name }}.{% endif %}
    {% if component.name is string %}{% set node_state.names = node_state.names + [component.name] %}{% endif %}
    {% if component.path is not string or not (component.path | trim) %}Every component requires a non-empty string path.{% elif '..' in component.path.split('/') or (component.path | regex_search('[*?\\[]')) %}Component path must not contain .. segments or glob characters.{% endif %}
    {% for key, value in component.items() %}
    {% if key not in allowed_keys %}Unsupported component key: {{ key }}.{% elif key.endswith('_version') and (value is not string or not (value | trim)) %}{{ key }} must be a non-empty string such as "24".{% endif %}
    {% endfor %}
    {% endif %}
    {% endfor %}
    {% endif %}

docker_images:
  when: "{{ module == 'docker' }}"
  type: yaml
  help: "Docker images such as [{id: app-docker, context: ., dockerfile: Dockerfile}]. id is the stable GitHub Actions job identifier; name, context, dockerfile and target are optional and mirror the docker-build workflow inputs."
  default: >-
    {% if _commit is defined and docker_images is defined %}{{ docker_images }}{% else %}[{id: app-docker}]{% endif %}
  validator: >-
    {% set allowed_keys = ['context', 'dockerfile', 'id', 'name', 'target'] %}
    {% if docker_images is string or docker_images is mapping or docker_images is not sequence or not docker_images %}docker_images must be a non-empty YAML list of mappings.{% else %}
    {% set docker_state = namespace(ids=[], names=[]) %}
    {% for component in docker_images %}
    {% if component is not mapping %}Every docker image must be a mapping with an id.{% else %}
    {% if component.id is not string or not (component.id | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}Every image requires an id matching ^[A-Za-z_][A-Za-z0-9_-]*$.{% endif %}
    {% if component.id in docker_state.ids %}Image ids must be unique: {{ component.id }}.{% endif %}
    {% if component.id is string %}{% set docker_state.ids = docker_state.ids + [component.id] %}{% endif %}
    {% if 'name' in component and (component.name is not string or not (component.name | trim)) %}name must be a non-empty string.{% endif %}
    {% set docker_name = component.name if component.name is string else component.id %}
    {% if docker_name is string and docker_name in docker_state.names %}Component names must be unique: {{ docker_name }}.{% endif %}
    {% if docker_name is string %}{% set docker_state.names = docker_state.names + [docker_name] %}{% endif %}
    {% if 'context' in component and (component.context is not string or '..' in component.context.split('/') or (component.context | regex_search('[*?\\[]'))) %}context must be a string without .. segments or glob characters.{% endif %}
    {% for key, value in component.items() %}
    {% if key not in allowed_keys %}Unsupported image key: {{ key }}.{% elif key.endswith('_version') and (value is not string or not (value | trim)) %}{{ key }} must be a non-empty string such as "24".{% endif %}
    {% endfor %}
    {% endif %}
    {% endfor %}
    {% endif %}

docker:
  when: "{{ module == 'legacy' }}"
  type: bool
  default: false
codeql:
  when: "{{ module in ['legacy', 'security'] }}"
  type: bool
  help: Generate the CodeQL workflow. Code scanning needs GitHub Advanced Security, which private repositories do not receive by default.
  default: true
codeql_languages:
  type: yaml
  help: "Optional explicit CodeQL language list. Empty derives the list from components (legacy) or the installed language modules (security); that is wrong for a repository whose source they do not describe. Supported: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, rust, swift."
  default: []
  when: "{{ module in ['legacy', 'security'] and codeql }}"
  validator: >-
    {% set allowed_codeql_languages = ['actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'] %}
    {% if codeql_languages is string or codeql_languages is mapping or codeql_languages is not sequence %}
    codeql_languages must be a YAML list of supported CodeQL language names.
    {% else %}
    {% set codeql_language_state = namespace(seen=[]) %}
    {% for language in codeql_languages %}
    {% if language is not string %}Every codeql_languages entry must be a string.{% elif language not in allowed_codeql_languages %}Unsupported CodeQL language: {{ language }}.{% elif language in codeql_language_state.seen %}Duplicate CodeQL language: {{ language }}.{% else %}{% set codeql_language_state.seen = codeql_language_state.seen + [language] %}{% endif %}
    {% endfor %}
    {% endif %}

handed_off:
  type: yaml
  # Fresh copies hand validate off. Stored answers without the key predate the
  # handoff and still rely on legacy validate.yml: default to [] there so the
  # validator refuses the update instead of silently dropping the workflow.
  default: >-
    {% if module == 'legacy' and _external_data.stored_answers is mapping and _external_data.stored_answers.get('_commit') %}[]{% else %}[validate]{% endif %}
  when: "{{ module == 'legacy' }}"
  help: Areas now owned by ci-kit modules; legacy stops rendering their files.
  validator: >-
    {% set allowed_handed_off = ['validate', 'base', 'security', 'release', 'allure', 'renovate'] %}
    {% if handed_off is string or handed_off is mapping or handed_off is not sequence %}
    handed_off must be a YAML list of area names.
    {% else %}
    {% set handed_off_state = namespace(seen=[]) %}
    {% for area in handed_off %}
    {% if area is not string %}Every handed_off entry must be a string.{% elif area not in allowed_handed_off %}Unknown handed_off area: {{ area }}.{% elif area in handed_off_state.seen %}Duplicate handed_off area: {{ area }}.{% else %}{% set handed_off_state.seen = handed_off_state.seen + [area] %}{% endif %}
    {% endfor %}
    {% if 'validate' not in handed_off %}CIK-LEGACY-006: validate must stay handed off; the legacy template no longer renders validate.yml. Hand validate off to the core module first; see docs/errors/CIK-LEGACY-006.md{% endif %}
    {% endif %}

gitleaks:
  when: "{{ module in ['legacy', 'security'] }}"
  type: bool
  help: Generate the checksum-verified Gitleaks workflow and stable gitleaks check context.
  default: true

allure_report:
  when: "{{ module == 'legacy' }}"
  type: bool
  help: Generate and comment an Allure 3 report from generated component jobs or an external workflow artifact contract.
  default: false
allure_source:
  type: str
  help: "Where Allure results come from: auto follows components; component uses the generated component jobs in Validate; external uses a project-owned workflow, so generated component jobs upload no Allure results."
  choices: "{{ ['component', 'external'] if module == 'allure' else ['auto', 'component', 'external'] }}"
  default: "{{ 'external' if module == 'allure' else 'auto' }}"
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: "{% if module == 'legacy' and allure_source == 'component' and not components %}allure_source=component requires at least one component.{% endif %}"
allure_mode:
  type: str
  default: "{{ allure_source if allure_source in ['component', 'external'] else ('component' if components else 'external') }}"
  when: false
allure_external_workflow_name:
  type: str
  help: Exact workflow name that uploads Allure artifacts when allure_source is external.
  default: Validate
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: "{% if not (allure_external_workflow_name | regex_search('^[A-Za-z0-9][A-Za-z0-9 ._()/:-]{0,99}$')) %}Use a non-empty workflow name containing only letters, digits, spaces, and ._()/:- characters.{% endif %}"
allure_external_workflow_path:
  type: str
  help: Repository-relative source workflow path when components is empty.
  default: .github/workflows/validate.yml
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: "{% if not (allure_external_workflow_path | regex_search('^\\.github/workflows/[A-Za-z0-9._-]+\\.ya?ml$')) %}Use a workflow path such as .github/workflows/test.yml.{% endif %}"
allure_external_artifact_prefix:
  type: str
  help: Prefix selecting dedicated Allure artifacts from the external source workflow.
  default: allure-results-
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: "{% if not (allure_external_artifact_prefix | regex_search('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')) %}Use a 1-64 character artifact prefix containing only letters, digits, dots, underscores, and hyphens.{% endif %}"
allure_external_artifact_min_count:
  type: int
  help: Minimum number of matching, non-expired Allure artifacts required.
  default: 1
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: "{% if allure_external_artifact_min_count < 1 or allure_external_artifact_min_count > 50 %}Choose a minimum artifact count from 1 through 50.{% endif %}"
allure_external_artifact_max_count:
  type: int
  help: Maximum number of matching Allure artifacts accepted by the bounded extractor.
  default: 50
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: "{% if allure_external_artifact_max_count < allure_external_artifact_min_count or allure_external_artifact_max_count > 50 %}Choose a maximum from the configured minimum through 50.{% endif %}"
allure_categories_file:
  type: str
  help: Optional safe repository-relative Allure categories JSON file.
  default: ""
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
  validator: >-
    {% if allure_categories_file and (not (allure_categories_file | regex_search('^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*\\.json$')) or '.' in allure_categories_file.split('/') or '..' in allure_categories_file.split('/')) %}
    Use a safe repository-relative JSON path without traversal or globs.
    {% endif %}
allure_publish_pages:
  type: bool
  help: Publish each pull request report below allure/pr-N on the gh-pages branch.
  default: false
  when: "{{ module == 'allure' or (module == 'legacy' and allure_report) }}"
allure_pages_url:
  type: str
  help: Full HTTPS base URL served by GitHub Pages, without a trailing slash (for example https://owner.github.io/repository).
  default: https://owner.github.io/repository
  when: "{{ (module == 'allure' and allure_publish_pages) or (module == 'legacy' and allure_report and allure_publish_pages) }}"
  validator: "{% if not (allure_pages_url | regex_search('^https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[A-Za-z0-9._~-]+)*$')) %}Use a full HTTPS Pages base URL without query, fragment, or trailing slash.{% endif %}"
release_please:
  when: "{{ module == 'legacy' }}"
  type: bool
  default: false
release_mode:
  type: str
  help: "Release Please mode: single for one version, manifest for independently versioned components."
  default: single
  choices:
    - single
    - manifest
  when: "{{ module == 'release' or (module == 'legacy' and release_please) }}"
renovate:
  when: "{{ module == 'legacy' }}"
  type: bool
  default: true

renovate_config_repository:
  when: "{{ module in ['legacy', 'renovate'] }}"
  type: str
  help: GitHub owner/repository slug hosting the shared Renovate preset.
  default: quokkify/renovate-presets
  validator: >-
    {% if not (renovate_config_repository | regex_search('^[A-Za-z0-9][A-Za-z0-9_-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$')) %}
    Use one GitHub owner/repository slug such as quokkify/renovate-presets; schemes, github>, paths, refs, whitespace, and templates are not allowed.
    {% endif %}

renovate_presets:
  when: "{{ module in ['legacy', 'renovate'] }}"
  type: yaml
  help: "Renovate preset names to extend. Supported names: default, python, javascript, java, docker, github-actions."
  default: >-
    {%- set presets = ['default', 'github-actions'] -%}
    {%- set component_types = components | map(attribute='type') | list -%}
    {%- if 'python' in component_types -%}{%- set _ = presets.append('python') -%}{%- endif -%}
    {%- if 'node' in component_types -%}{%- set _ = presets.append('javascript') -%}{%- endif -%}
    {%- if 'java' in component_types -%}{%- set _ = presets.append('java') -%}{%- endif -%}
    {%- if docker -%}{%- set _ = presets.append('docker') -%}{%- endif -%}
    {{ presets }}
  validator: >-
    {% set allowed_renovate_presets = ['default', 'python', 'javascript', 'java', 'docker', 'github-actions'] %}
    {% if renovate_presets is string or renovate_presets is mapping or renovate_presets is not sequence %}
    renovate_presets must be a non-empty YAML list of supported preset names.
    {% elif not renovate_presets %}
    Choose at least one Renovate preset.
    {% else %}
    {% set renovate_preset_state = namespace(seen=[]) %}
    {% for preset in renovate_presets %}
    {% if preset is not string %}Every renovate_presets entry must be a string.{% elif preset not in allowed_renovate_presets %}Unsupported Renovate preset: {{ preset }}.{% elif preset in renovate_preset_state.seen %}Duplicate Renovate preset: {{ preset }}.{% else %}{% set renovate_preset_state.seen = renovate_preset_state.seen + [preset] %}{% endif %}
    {% endfor %}
    {% endif %}
