_min_copier_version: "9.18.2"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_exclude:
  # Rendered before file generation: Copier's --defaults does not validate
  # retained question defaults and can discard invalid boolean answers. Skip
  # the inherited guard in Copier's old-template scratch render; the current
  # template evaluates its own exclusions with no inherited guard marker.
  - >-
    {% set selected_release = _copier_answers.get('_commit', '') %}
    {% if '__allure_pin_mismatch__' not in (_copier_conf.exclude | join(' ')) and allure_report and (selected_release | regex_search('^v[0-9]+\\.[0-9]+\\.[0-9]+$')) and toolkit_version != selected_release %}
    {{ _copier_conf['__allure_pin_mismatch__'] | mandatory('Allure reusable workflows require the selected toolkit release. Retry with --data toolkit_version=' ~ selected_release) }}
    {% endif %}
  - "{% if not renovate %}.github/renovate.json{% endif %}"
  - "{% if not release_please %}.github/workflows/release.yml{% endif %}"
  - "{% if not release_please %}.github/release-please/config.json{% endif %}"
  - "{% if not release_please %}.github/release-please/manifest.json{% endif %}"
  - "{% if not release_please %}.github/scripts/enrich_release_notes.py{% endif %}"
  - "{% if not codeql %}.github/workflows/codeql.yml{% endif %}"
  - "{% if not gitleaks %}.github/workflows/gitleaks.yml{% endif %}"
  - "{% if not allure_report %}.github/allure/allurerc.mjs{% endif %}"
  - "{% if not allure_report %}.github/allure/safe_extract.py{% endif %}"
  - "{% if not allure_report %}.github/workflows/allure-report.yml{% endif %}"

# Written once when the project is generated, then owned by the project.
# The template ships a starter README and a minimal Renovate config; real
# projects rewrite the README and extend the Renovate config with their own
# managers and rules, so a later `copier update` must not overwrite either.
# Toolkit-owned Renovate policy reaches these projects through the shared
# preset in `extends`, not by rewriting the file.
_skip_if_exists:
  - /README.md
  - .github/renovate.json
  - .github/release-please/config.json
  - .github/release-please/manifest.json
  - .github/pull_request_template.md

project_name:
  type: str
  help: Human-readable project name.
  default: my-project

toolkit_version:
  type: str
  help: Immutable ci-kit SemVer tag used by generated workflows.
  # Fresh copies use the selected immutable template tag, including Copier's
  # automatic latest-tag selection. Existing answers still take precedence.
  default: "{{ _copier_answers.get('_commit', '') if (_copier_answers.get('_commit', '') | regex_search('^v[0-9]+\\.[0-9]+\\.[0-9]+$')) else 'v3.1.1' }}"
  validator: "{% if not (toolkit_version | regex_search('^v[0-9]+\\.[0-9]+\\.[0-9]+$')) %}Use an exact tag such as v3.1.1{% endif %}"

components:
  type: yaml
  help: "Required component mappings such as [{type: python, path: backend, id: backend-python, name: Backend Python, allure_results_path: allure-results}]. id is the stable GitHub Actions job identifier and name is its display name. The Allure path is optional, component-relative, and defaults to allure-results. Supported types: python, node, java."
  # On update, retain the prior value long enough for its required identity
  # validation to fail closed; never replace a legacy topology with defaults.
  default: >-
    {% if _commit is defined and components is defined %}{{ components }}{% else %}[{type: python, path: ., id: app-python, name: Application Python}]{% endif %}
  validator: >-
    {% for component in components %}
    {% if component is not mapping %}Every component must be a mapping with type, path, id, and name.{% else %}
    {% if component.type not in ['python', 'node', 'java'] %}Unsupported component type: {{ component.type }}.{% endif %}
    {% if component.path is not string or not component.path | trim %}Every component requires a non-empty string path.{% endif %}
    {% if component.id is not string or not (component.id | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}Every component requires an id matching ^[A-Za-z_][A-Za-z0-9_-]*$.{% endif %}
    {% if component.name is not string or not (component.name | trim) %}Every component requires a non-empty string name.{% endif %}
    {% if component.id in ['template-contract', 'docker', 'release', 'update', 'scan', 'analyze', 'resolve', 'generate', 'comment', 'pages', 'changes', 'integration'] %}Component id {{ component.id }} conflicts with a generated job id.{% endif %}
    {% set component_state = namespace(ids=[]) %}
    {% for candidate in components[:loop.index] %}{% if candidate is mapping and candidate.id is string %}{% set component_state.ids = component_state.ids + [candidate.id] %}{% endif %}{% endfor %}
    {% if component_state.ids | select('equalto', component.id) | list | length > 1 %}Component ids must be unique: {{ component.id }}.{% endif %}
    {% set allure_path = component.get('allure_results_path', 'allure-results') %}
    {% if allure_path is not string or not (allure_path | trim) %}allure_results_path must be a non-empty string.{% elif not (allure_path | regex_search('^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$')) or '.' in allure_path.split('/') or '..' in allure_path.split('/') %}allure_results_path must be a safe component-relative path without traversal or globs.{% endif %}
    {% endif %}
    {% endfor %}

docker:
  type: bool
  default: false
codeql:
  type: bool
  help: Generate the CodeQL workflow. Code scanning needs GitHub Advanced Security, which private repositories do not receive by default.
  default: true
codeql_languages:
  type: yaml
  help: "Optional explicit CodeQL language list. Empty derives the list from components, which is wrong for a repository whose source is not described by components. Supported: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, rust, swift."
  default: []
  when: "{{ codeql }}"
  validator: >-
    {% set allowed_codeql_languages = ['actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'] %}
    {% if codeql_languages is string or codeql_languages is mapping or codeql_languages is not sequence %}
    codeql_languages must be a YAML list of supported CodeQL language names.
    {% else %}
    {% set codeql_language_state = namespace(seen=[]) %}
    {% for language in codeql_languages %}
    {% if language is not string %}Every codeql_languages entry must be a string.{% elif language not in allowed_codeql_languages %}Unsupported CodeQL language: {{ language }}.{% elif language in codeql_language_state.seen %}Duplicate CodeQL language: {{ language }}.{% else %}{% set codeql_language_state.seen = codeql_language_state.seen + [language] %}{% endif %}
    {% endfor %}
    {% endif %}

gitleaks:
  type: bool
  help: Generate the checksum-verified Gitleaks workflow and stable gitleaks check context.
  default: true

allure_report:
  type: bool
  help: Generate and comment an Allure 3 report from generated component jobs or an external workflow artifact contract.
  default: false
allure_source:
  type: str
  help: "Where Allure results come from: auto follows components; component uses the generated component jobs in Validate; external uses a project-owned workflow, so generated component jobs upload no Allure results."
  choices: [auto, component, external]
  default: auto
  when: "{{ allure_report }}"
  validator: "{% if allure_source == 'component' and not components %}allure_source=component requires at least one component.{% endif %}"
allure_mode:
  type: str
  default: "{{ allure_source if allure_source in ['component', 'external'] else ('component' if components else 'external') }}"
  when: false
allure_external_workflow_name:
  type: str
  help: Exact workflow name that uploads Allure artifacts when allure_source is external.
  default: Validate
  when: "{{ allure_report }}"
  validator: "{% if not (allure_external_workflow_name | regex_search('^[A-Za-z0-9][A-Za-z0-9 ._()/:-]{0,99}$')) %}Use a non-empty workflow name containing only letters, digits, spaces, and ._()/:- characters.{% endif %}"
allure_external_workflow_path:
  type: str
  help: Repository-relative source workflow path when components is empty.
  default: .github/workflows/validate.yml
  when: "{{ allure_report }}"
  validator: "{% if not (allure_external_workflow_path | regex_search('^\\.github/workflows/[A-Za-z0-9._-]+\\.ya?ml$')) %}Use a workflow path such as .github/workflows/test.yml.{% endif %}"
allure_external_artifact_prefix:
  type: str
  help: Prefix selecting dedicated Allure artifacts from the external source workflow.
  default: allure-results-
  when: "{{ allure_report }}"
  validator: "{% if not (allure_external_artifact_prefix | regex_search('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')) %}Use a 1-64 character artifact prefix containing only letters, digits, dots, underscores, and hyphens.{% endif %}"
allure_external_artifact_min_count:
  type: int
  help: Minimum number of matching, non-expired Allure artifacts required.
  default: 1
  when: "{{ allure_report }}"
  validator: "{% if allure_external_artifact_min_count < 1 or allure_external_artifact_min_count > 50 %}Choose a minimum artifact count from 1 through 50.{% endif %}"
allure_external_artifact_max_count:
  type: int
  help: Maximum number of matching Allure artifacts accepted by the bounded extractor.
  default: 50
  when: "{{ allure_report }}"
  validator: "{% if allure_external_artifact_max_count < allure_external_artifact_min_count or allure_external_artifact_max_count > 50 %}Choose a maximum from the configured minimum through 50.{% endif %}"
allure_categories_file:
  type: str
  help: Optional safe repository-relative Allure categories JSON file.
  default: ""
  when: "{{ allure_report }}"
  validator: >-
    {% if allure_categories_file and (not (allure_categories_file | regex_search('^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*\\.json$')) or '.' in allure_categories_file.split('/') or '..' in allure_categories_file.split('/')) %}
    Use a safe repository-relative JSON path without traversal or globs.
    {% endif %}
allure_publish_pages:
  type: bool
  help: Publish each pull request report below allure/pr-N on the gh-pages branch.
  default: false
  when: "{{ allure_report }}"
allure_pages_url:
  type: str
  help: Full HTTPS base URL served by GitHub Pages, without a trailing slash (for example https://owner.github.io/repository).
  default: https://owner.github.io/repository
  when: "{{ allure_report and allure_publish_pages }}"
  validator: "{% if not (allure_pages_url | regex_search('^https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[A-Za-z0-9._~-]+)*$')) %}Use a full HTTPS Pages base URL without query, fragment, or trailing slash.{% endif %}"
release_please:
  type: bool
  default: false
release_mode:
  type: str
  help: "Release Please mode: single for one version, manifest for independently versioned components."
  default: single
  choices:
    - single
    - manifest
  when: "{{ release_please }}"
renovate:
  type: bool
  default: true

renovate_config_repository:
  type: str
  help: GitHub owner/repository slug hosting the shared Renovate preset.
  default: quokkify/renovate-presets
  validator: >-
    {% if not (renovate_config_repository | regex_search('^[A-Za-z0-9][A-Za-z0-9_-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$')) %}
    Use one GitHub owner/repository slug such as quokkify/renovate-presets; schemes, github>, paths, refs, whitespace, and templates are not allowed.
    {% endif %}

renovate_presets:
  type: yaml
  help: "Renovate preset names to extend. Supported names: default, python, javascript, java, docker, github-actions."
  default: >-
    {%- set presets = ['default', 'github-actions'] -%}
    {%- set component_types = components | map(attribute='type') | list -%}
    {%- if 'python' in component_types -%}{%- set _ = presets.append('python') -%}{%- endif -%}
    {%- if 'node' in component_types -%}{%- set _ = presets.append('javascript') -%}{%- endif -%}
    {%- if 'java' in component_types -%}{%- set _ = presets.append('java') -%}{%- endif -%}
    {%- if docker -%}{%- set _ = presets.append('docker') -%}{%- endif -%}
    {{ presets }}
  validator: >-
    {% set allowed_renovate_presets = ['default', 'python', 'javascript', 'java', 'docker', 'github-actions'] %}
    {% if renovate_presets is string or renovate_presets is mapping or renovate_presets is not sequence %}
    renovate_presets must be a non-empty YAML list of supported preset names.
    {% elif not renovate_presets %}
    Choose at least one Renovate preset.
    {% else %}
    {% set renovate_preset_state = namespace(seen=[]) %}
    {% for preset in renovate_presets %}
    {% if preset is not string %}Every renovate_presets entry must be a string.{% elif preset not in allowed_renovate_presets %}Unsupported Renovate preset: {{ preset }}.{% elif preset in renovate_preset_state.seen %}Duplicate Renovate preset: {{ preset }}.{% else %}{% set renovate_preset_state.seen = renovate_preset_state.seen + [preset] %}{% endif %}
    {% endfor %}
    {% endif %}
