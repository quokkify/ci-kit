name: Composite action examples
on: [pull_request]

permissions:
  contents: read

jobs:
  setup-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: quokkify/ci-kit/actions/setup-python@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
        with:
          python-version: "3.12"
          working-directory: .

  setup-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: quokkify/ci-kit/actions/setup-node@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
        with:
          node-version: "22"
          working-directory: .

  setup-java:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java and Gradle cache
        id: java
        uses: quokkify/ci-kit/actions/setup-java-gradle@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
        with:
          java-version: "17"
          distribution: temurin
          working-directory: .
      # This released revision exposes gradle-command; the new project-aware output
      # is exercised against the current source in tests/test_composite_actions.py.
      - name: Inspect the selected Gradle project
        shell: bash
        env:
          GRADLE_COMMAND: ${{ steps.java.outputs.gradle-command }}
        run: bash -euo pipefail -c "$GRADLE_COMMAND --version"

  compose-up:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start and wait for compose services
        uses: quokkify/ci-kit/actions/compose-up@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
        with:
          compose-files: |
            docker-compose.yml
            docker-compose.test.yml
          working-directory: .
          services: web,postgres
          build: "true"
          wait-for-health: "true"
          wait-urls: http://127.0.0.1:8080/health
          timeout-seconds: "120"
          url-timeout-seconds: "5"
      - name: Stop compose services
        if: ${{ always() }}
        shell: bash
        working-directory: .
        run: |
          docker compose \
            --file docker-compose.yml \
            --file docker-compose.test.yml \
            down --remove-orphans

  junit-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests with JUnit output
        run: your-test-command --junit-output test-results/junit.xml
      - name: Write JUnit job summary
        if: ${{ always() }}
        uses: quokkify/ci-kit/actions/junit-step-summary@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
        with:
          junit-paths: test-results/**/*.xml
          title: Test results

  deploy-pages-subdirectory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build static report
        run: mkdir -p report && printf '%s\n' '<h1>Report</h1>' > report/index.html
      - name: Publish report under a stable subdirectory
        # Delegates publication to the standalone gh-pages-subdir action.
        uses: quokkify/ci-kit/actions/deploy-gh-pages-subdir@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish-dir: report
          destination-dir: reports/example
