name: Product release
# Requires the latest published immutable v2.3.0 toolkit tag.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    uses: quokkify/ci-kit/.github/workflows/release-please.yml@a64c987642f25d81e6bc3531336225fcde0ba4d5 # v2.22.0
    with:
      mode: single
      release-type: simple
