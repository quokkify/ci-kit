name: Auto-update Copier-managed repositories

on:
  schedule:
    # Monday 4:17 AM UTC: write-mode safety net for anything the release-triggered run missed.
    - cron: "17 4 * * 1"
    # Every other day at 4:17 AM UTC: read-only drift audit. This replaces the separate audit
    # workflow; the badge stays green while the public fleet matches the latest released template.
    - cron: "17 4 * * 0,2-6"
  # Called by release.yml right after Release Please tags a new toolkit version.
  # A `release`/`push: tags` trigger cannot be used instead: Release Please tags
  # with GITHUB_TOKEN, and GITHUB_TOKEN events never start a new workflow run.
  workflow_call:
    inputs:
      repository:
        description: Optional public owner/repository to update instead of the whole organization.
        type: string
        required: false
      template-ref:
        description: Optional project-toolkit ref; empty uses the latest released tag.
        type: string
        required: false
      dry-run:
        description: Run in dry-run mode (audit only, no PRs created).
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      repository:
        description: Optional public owner/repository to update instead of the whole organization.
        type: string
        required: false
      template-ref:
        description: Optional project-toolkit ref; empty uses the latest released tag.
        type: string
        required: false
      dry-run:
        description: Run in dry-run mode (audit only, no PRs created).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Full-fleet runs share one lock, while explicitly targeted repositories can
  # update independently. GitHub retains only one pending run per group, so a
  # static group silently cancelled earlier targeted dispatches.
  group: "copier-fleet-auto-update-${{ inputs.repository || 'fleet' }}"
  cancel-in-progress: false

jobs:
  update:
    name: Update Copier fleet and create PRs
    if: ${{ github.repository == 'quokkify/project-toolkit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out project-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and Copier
        uses: ./actions/setup-python
        with:
          python-version: "3.14"
          package-manager: pip
          cache-dependencies: "false"
          install-command: python -m pip install copier==9.18.2

      - name: Update Copier fleet
        id: update
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
          TEMPLATE_REF: ${{ inputs.template-ref }}
          DRY_RUN: ${{ inputs.dry-run || github.event.schedule == '17 4 * * 0,2-6' }}
          # Write mode needs a credential installed on public quokkify repositories only.
          # Dry-run mode never writes and uses the repository-scoped Actions token.
          GH_TOKEN: ${{ secrets.FLEET_UPDATE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --org quokkify
            --public-only
            --exclude quokkify/.github
            --exclude quokkify/project-toolkit
            --branch automation/copier-template-update
          )
          if [[ "${DRY_RUN:-}" == "true" ]]; then
            args+=(--dry-run)
          else
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "::error::FLEET_UPDATE_TOKEN is required for write mode; it must be a credential scoped to public quokkify repositories only." >&2
              exit 2
            fi
            args+=(--write)
          fi
          if [[ -n "${REQUESTED_REPOSITORY:-}" ]]; then
            # --repo bypasses organization discovery entirely, so --org cannot contain it.
            if [[ "$REQUESTED_REPOSITORY" != quokkify/* ]]; then
              echo "::error::repository must be a quokkify/* slug; this front serves one organization." >&2
              exit 2
            fi
            args+=(--repo "$REQUESTED_REPOSITORY")
          fi
          if [[ -n "${TEMPLATE_REF:-}" ]]; then
            args+=(--template-ref "$TEMPLATE_REF")
          fi
          output="$RUNNER_TEMP/copier-fleet-update.txt"
          markdown_report="$RUNNER_TEMP/copier-fleet-update.md"
          json_report="$RUNNER_TEMP/copier-fleet-update.json"
          args+=(--markdown-report "$markdown_report" --json-report "$json_report")
          set +e
          python scripts/rollout_copier_fleet.py "${args[@]}" 2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f "$markdown_report" ]]; then
            cat "$markdown_report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Copier fleet update\n\nThe run failed before a report was written; see the job log.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Copier fleet update report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copier-fleet-update
          path: ${{ runner.temp }}/copier-fleet-update.json
          if-no-files-found: warn
