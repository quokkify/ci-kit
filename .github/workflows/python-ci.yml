name: Reusable Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory relative to the repository root.
        type: string
        default: .
      python-version:
        description: Python version accepted by actions/setup-python.
        type: string
        default: "3.12"
      package-manager:
        description: One of auto, pip, uv, or poetry.
        type: string
        default: auto
      uv-version:
        description: Exact uv version used for dependency installation.
        type: string
        default: "0.12.19"
      poetry-version:
        description: Exact Poetry version used for dependency installation.
        type: string
        default: "2.5.1"
      requirements-file:
        description: Requirements file relative to working-directory; auto-detected when empty.
        type: string
        default: ""
      install-command:
        description: Optional trusted shell command overriding dependency installation.
        type: string
        default: ""
      lint-command:
        description: Trusted shell command used for linting.
        type: string
        default: "python -m compileall -q ."
      test-command:
        description: Trusted shell command used for tests.
        type: string
        default: "python -m unittest discover"
      build-command:
        description: Optional trusted shell command used to build the project.
        type: string
        default: ""
      run-lint:
        description: Run the lint step.
        type: boolean
        default: true
      run-tests:
        description: Run the test step.
        type: boolean
        default: true
      run-build:
        description: Run the build step when build-command is non-empty.
        type: boolean
        default: false
      cache-dependencies:
        description: Cache common Python package-manager directories.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 20
      upload-test-artifacts:
        description: Upload test artifacts. Disabled unless explicitly enabled.
        type: boolean
        default: false
      test-artifact-path:
        description: Path or glob to upload when upload-test-artifacts is enabled.
        type: string
        default: test-results
      test-artifact-name:
        description: Artifact name used when upload-test-artifacts is enabled.
        type: string
        default: python-test-artifacts

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs
        shell: bash
        working-directory: .
        env:
          CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
          INSTALL_DEPENDENCIES: "true"
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          POETRY_VERSION: ${{ inputs.poetry-version }}
          UV_VERSION: ${{ inputs.uv-version }}
        run: |
          set -euo pipefail
          for input in "cache-dependencies=$CACHE_DEPENDENCIES" "install-dependencies=$INSTALL_DEPENDENCIES"; do
            name=${input%%=*}
            value=${input#*=}
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "$name must be 'true' or 'false': $value" >&2
              exit 2
            fi
          done
          case "$PACKAGE_MANAGER" in
            auto|pip|uv|poetry) ;;
            *) echo "Unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
          esac
          if [[ -z "$UV_VERSION" || -z "$POETRY_VERSION" ]]; then
            echo "uv-version and poetry-version must be exact non-empty versions" >&2
            exit 2
          fi
      - name: Set up Python
        id: runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Prepare Python package manager
        id: manager
        shell: bash
        working-directory: .
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          UV_VERSION: ${{ inputs.uv-version }}
          POETRY_VERSION: ${{ inputs.poetry-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          manager="$PACKAGE_MANAGER"
          if [[ -n "$INSTALL_COMMAND" ]]; then
            # Custom installers own their tooling; retain only the runtime package cache.
            manager=pip
          fi
          if [[ "$manager" == auto ]]; then
            if [[ -f uv.lock ]]; then manager=uv
            elif [[ -f poetry.lock ]]; then manager=poetry
            else manager=pip
            fi
          fi
          case "$manager" in
            uv) python -m pip install "uv==$UV_VERSION" ;;
            poetry) python -m pip install "poetry==$POETRY_VERSION" ;;
          esac
          echo "name=$manager" >> "$GITHUB_OUTPUT"
          # pip reports its version plus the interpreter path; retain just the version.
          case "$manager" in
            pip) version="$(python -m pip --version | awk '{print $2}')" ;;
            uv) version="$UV_VERSION" ;;
            poetry) version="$POETRY_VERSION" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$CACHE_DEPENDENCIES" == true ]]; then
            case "$manager" in
              pip) cache_path="$(python -m pip cache dir)" ;;
              uv) cache_path="$(uv cache dir)" ;;
              poetry) cache_path="$(poetry config cache-dir)" ;;
            esac
            [[ -n "$cache_path" && "$cache_path" != *$'\n'* ]] || { echo "Invalid cache path" >&2; exit 2; }
            if [[ "$manager" == poetry ]]; then
              # Cache downloaded artifacts and metadata, never Poetry virtualenvs.
              printf 'cache-path<<TOOLKIT_CACHE\n%s/cache\n%s/artifacts\nTOOLKIT_CACHE\n' "$cache_path" "$cache_path" >> "$GITHUB_OUTPUT"
            else
              echo "cache-path=$cache_path" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Cache Python dependencies
        if: ${{ inputs.cache-dependencies }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.manager.outputs.cache-path }}
          key: python-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.python-version }}-${{ steps.manager.outputs.name }}-${{ steps.manager.outputs.version }}-${{ hashFiles(format('{0}/**/uv.lock', inputs.working-directory), format('{0}/**/poetry.lock', inputs.working-directory), format('{0}/**/requirements*.txt', inputs.working-directory), format('{0}/**/pyproject.toml', inputs.working-directory), format('{0}/{1}', inputs.working-directory, inputs.requirements-file || 'requirements.txt')) }}
          restore-keys: |
            python-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.python-version }}-${{ steps.manager.outputs.name }}-${{ steps.manager.outputs.version }}-
      - name: Install Python dependencies
        shell: bash
        working-directory: .
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ steps.manager.outputs.name }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PYTHON_PATH: ${{ steps.runtime.outputs.python-path }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"

          if [[ -n "$INSTALL_COMMAND" ]]; then
            bash -euo pipefail -c "$INSTALL_COMMAND"
            exit 0
          fi

          project_environment=""
          case "$PACKAGE_MANAGER" in
            uv)
              uv sync --frozen --python "$PYTHON_PATH" --no-python-downloads
              project_environment="$(uv run --no-sync --python "$PYTHON_PATH" --no-python-downloads python -c 'import sys; print(sys.prefix)')"
              ;;
            poetry)
              poetry env use "$PYTHON_PATH"
              poetry install --no-interaction
              project_environment="$(poetry env info --path)"
              ;;
            pip)
              requirements="$REQUIREMENTS_FILE"
              if [[ -n "$requirements" && ! -f "$requirements" ]]; then
                echo "requirements-file does not exist: $requirements" >&2
                exit 2
              fi
              if [[ -z "$requirements" && -f requirements.txt ]]; then
                requirements=requirements.txt
              elif [[ -z "$requirements" ]]; then
                shopt -s nullglob
                candidates=(requirements*.txt)
                shopt -u nullglob
                if (( ${#candidates[@]} == 1 )); then
                  requirements="${candidates[0]}"
                elif (( ${#candidates[@]} > 1 )); then
                  echo "Multiple requirements files found; set requirements-file explicitly" >&2
                  exit 2
                fi
              fi
              if [[ -n "$requirements" ]]; then
                python -m pip install -r "$requirements"
              elif [[ -f pyproject.toml ]]; then
                python -m pip install -e .
              else
                echo "No Python dependency manifest found; continuing without install"
              fi
              ;;
          esac

          # Make the installed project available to ordinary python/pytest commands in later steps.
          if [[ -n "$project_environment" ]]; then
            if [[ -d "$project_environment/Scripts" ]]; then environment_bin="$project_environment/Scripts"
            else environment_bin="$project_environment/bin"
            fi
            echo "$environment_bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=$project_environment" >> "$GITHUB_ENV"
          fi
      - name: Lint
        if: ${{ inputs.run-lint }}
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: ${{ inputs.run-build && inputs.build-command != '' }}
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload test artifacts
        if: ${{ always() && inputs.upload-test-artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test-artifact-name }}
          path: ${{ format('{0}/{1}', inputs.working-directory, inputs.test-artifact-path) }}
          if-no-files-found: error
