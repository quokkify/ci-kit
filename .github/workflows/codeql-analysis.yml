name: CodeQL analysis

on:
  workflow_call:
    inputs:
      languages-override:
        description: JSON list of CodeQL languages; an empty list analyzes actions plus the languages of the installed modules.
        type: string
        required: false
        default: "[]"
      toolkit-ref:
        description: ci-kit ref installed to plan the modules; empty selects the called workflow commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - name: Read languages override
        id: override
        env:
          OVERRIDE: ${{ inputs.languages-override }}
        run: |
          python3 - <<'PY'
          import json
          import os

          try:
              override = json.loads(os.environ["OVERRIDE"])
          except json.JSONDecodeError as error:
              raise SystemExit(f"languages-override is not valid JSON: {error}")
          if not isinstance(override, list) or not all(isinstance(language, str) for language in override):
              raise SystemExit("languages-override must be a JSON list of CodeQL language names")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"plan={'false' if override else 'true'}\n")
          PY
      - name: Check out repository
        if: steps.override.outputs.plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out toolkit
        if: steps.override.outputs.plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .toolkit
          persist-credentials: false
      - name: Set up Python
        if: steps.override.outputs.plan == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install ci-kit
        if: steps.override.outputs.plan == 'true'
        run: python -m pip install ./.toolkit
      # Languages come from the module declarations alone. Drift and other
      # findings belong to Validate; they must not stop security scanning.
      - name: Plan modules
        id: plan
        if: steps.override.outputs.plan == 'true'
        run: |
          if ! ci-kit plan --repo . --no-drift --github-output "$GITHUB_OUTPUT"; then
            echo "::warning title=ci-kit plan::ci-kit plan reported findings; CodeQL still analyzes the planned languages. Validate reports the findings."
          fi
      - name: Select languages
        id: languages
        env:
          OVERRIDE: ${{ inputs.languages-override }}
          PLAN_NEEDED: ${{ steps.override.outputs.plan }}
          PLANNED: ${{ steps.plan.outputs.codeql }}
        run: |
          python3 - <<'PY'
          import json
          import os

          languages = json.loads(os.environ["OVERRIDE"])
          if os.environ["PLAN_NEEDED"] == "true":
              if not os.environ["PLANNED"]:
                  raise SystemExit("ci-kit plan produced no codeql output")
              languages = json.loads(os.environ["PLANNED"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"languages={json.dumps(languages, separators=(',', ':'))}\n")
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
