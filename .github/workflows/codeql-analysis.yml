name: CodeQL analysis

on:
  workflow_call:
    inputs:
      languages-override:
        description: JSON list of CodeQL languages; an empty list analyzes actions plus the languages of the installed modules.
        type: string
        required: false
        default: "[]"
      toolkit-ref:
        description: ci-kit ref installed to plan the modules; empty selects the called workflow commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .toolkit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install ci-kit
        run: python -m pip install ./.toolkit
      - name: Plan modules
        id: plan
        if: inputs.languages-override == '[]'
        run: ci-kit plan --repo . --github-output "$GITHUB_OUTPUT"
      - name: Select languages
        id: languages
        env:
          OVERRIDE: ${{ inputs.languages-override }}
          PLANNED: ${{ steps.plan.outputs.codeql }}
        run: |
          python - <<'PY'
          import json
          import os

          languages = json.loads(os.environ["OVERRIDE"]) or json.loads(os.environ["PLANNED"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"languages={json.dumps(languages, separators=(',', ':'))}\n")
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
