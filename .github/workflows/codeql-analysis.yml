name: CodeQL analysis

on:
  workflow_call:
    inputs:
      languages-override:
        description: JSON list of CodeQL languages; an empty list analyzes actions plus the languages of the installed modules.
        type: string
        required: false
        default: "[]"
      toolkit-ref:
        description: ci-kit ref installed to plan the modules; empty selects the called workflow commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - name: Read languages override
        id: override
        env:
          OVERRIDE: ${{ inputs.languages-override }}
        run: |
          python3 -I - <<'PY'
          import json
          import os

          try:
              override = json.loads(os.environ["OVERRIDE"])
          except json.JSONDecodeError as error:
              raise SystemExit(f"languages-override is not valid JSON: {error}")
          if not isinstance(override, list) or not all(isinstance(language, str) for language in override):
              raise SystemExit("languages-override must be a JSON list of CodeQL language names")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"plan={'false' if override else 'true'}\n")
          PY
      - name: Check out repository
        if: steps.override.outputs.plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out toolkit
        if: steps.override.outputs.plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .toolkit
          persist-credentials: false
      - name: Set up Python
        if: steps.override.outputs.plan == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # From here on Python runs isolated (-I) and outside the checkout, so
      # modules in the pull request (a root json.py, pip/, yaml.py) are never
      # imported in place of the interpreter's or the toolkit's own.
      - name: Install ci-kit
        if: steps.override.outputs.plan == 'true'
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install "$GITHUB_WORKSPACE/.toolkit"
      # Languages come from the module declarations alone. Drift and other
      # findings belong to Validate; they must not stop security scanning.
      - name: Plan modules
        id: plan
        if: steps.override.outputs.plan == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          if ! ci-kit plan --repo "$GITHUB_WORKSPACE" --no-drift --github-output "$GITHUB_OUTPUT"; then
            echo "::warning title=ci-kit plan::ci-kit plan reported findings; CodeQL still analyzes the planned languages. Validate reports the findings."
          fi
      # A pull request controls its own module files, so it could drop a
      # language by deleting them. Pull requests therefore also plan from the
      # base commit's files, read as data with git and planned by the pinned
      # toolkit. Without a base plan the job fails rather than trusting the head.
      - name: Plan base commit modules
        id: base-plan
        if: steps.override.outputs.plan == 'true'
        working-directory: ${{ runner.temp }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path


          def output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")


          def fail(message):
              print(f"::error title=CodeQL base plan::{message}; refusing to plan CodeQL languages from the pull request head alone")
              raise SystemExit(1)


          def git(*args):
              return subprocess.run(["git", "-C", os.environ["GITHUB_WORKSPACE"], *args], capture_output=True)


          if os.environ["EVENT_NAME"] not in ("pull_request", "pull_request_target"):
              output("needed", "false")
              raise SystemExit(0)
          output("needed", "true")
          base = os.environ["BASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", base):
              fail(f"the pull request base commit {base!r} is not a commit SHA")
          if git("cat-file", "-e", f"{base}^{{commit}}").returncode != 0:
              git("fetch", "--no-tags", "--depth=1", "origin", base)
          if git("cat-file", "-e", f"{base}^{{commit}}").returncode != 0:
              fail(f"cannot read the pull request base commit {base}")

          tree = Path(tempfile.mkdtemp(prefix="codeql-base-", dir=os.environ.get("RUNNER_TEMP") or None))
          (tree / ".ci/modules").mkdir(parents=True)
          for location, pattern in (("", r"\.copier-answers\.[^/]+\.yml"), (".ci/modules/", r"\.ci/modules/[^/]+\.yml")):
              listing = git("ls-tree", "-z", base, "--", location or ".")
              if listing.returncode != 0:
                  fail(f"cannot list the pull request base commit {base}")
              for entry in listing.stdout.split(b"\0"):
                  if not entry:
                      continue
                  meta, _, name = entry.decode("utf-8", "surrogateescape").partition("\t")
                  _, kind, oid = meta.split()
                  if kind == "blob" and re.fullmatch(pattern, name):
                      blob = git("cat-file", "blob", oid)
                      if blob.returncode != 0:
                          fail(f"cannot read {name} from the pull request base commit {base}")
                      (tree / name).write_bytes(blob.stdout)

          plan_output = tree.with_name(tree.name + ".out")
          plan = subprocess.run(
              ["ci-kit", "plan", "--repo", str(tree), "--no-drift", "--github-output", str(plan_output)],
              capture_output=True, text=True,
          )
          planned = dict(line.split("=", 1) for line in plan_output.read_text(encoding="utf-8").splitlines()) if plan_output.exists() else {}
          try:
              codes = json.loads(planned.get("codes", "[]"))
          except json.JSONDecodeError:
              codes = []
          # Exit 1 with finding codes is a plan with findings, which Validate reports;
          # any other non-zero exit is a failure.
          if plan.returncode != 0 and not (plan.returncode == 1 and codes):
              print(plan.stdout + plan.stderr)
              fail(f"ci-kit plan failed with exit code {plan.returncode} for the pull request base commit {base}")
          if not planned.get("codeql"):
              print(plan.stdout + plan.stderr)
              fail(f"ci-kit plan produced no codeql output for the pull request base commit {base}")
          if plan.returncode:
              print(f"::warning title=ci-kit plan::the pull request base commit has plan findings {codes}; CodeQL still analyzes its languages.")
          print(f"Base commit {base} plans CodeQL languages {planned['codeql']}")
          output("codeql", planned["codeql"])
          PY
      - name: Select languages
        id: languages
        env:
          OVERRIDE: ${{ inputs.languages-override }}
          PLAN_NEEDED: ${{ steps.override.outputs.plan }}
          PLANNED: ${{ steps.plan.outputs.codeql }}
          BASE_NEEDED: ${{ steps.base-plan.outputs.needed }}
          BASE_PLANNED: ${{ steps.base-plan.outputs.codeql }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess

          # CodeQL fails a language without source, so a language only the base commit
          # declares is skipped when the pull request has none of the files CodeQL would
          # read for it; this exists only so removing a module with all its code stays
          # mergeable. When in doubt it is analyzed. File types are those of CodeQL 2.27.4
          # (the bundle of the pinned codeql-action, src/defaults.json): FileType JS,
          # TYPESCRIPT and HTML in
          # javascript/extractor/src/com/semmle/js/extractor/FileExtractor.java,
          # PY_EXTENSIONS in python/extractor/semmle/util.py plus .pyi stubs, and .java
          # for Java with `build-mode: none`.
          SOURCE_SUFFIXES = {
              "python": (".py", ".pyw", ".pyi"),
              "javascript-typescript": (
                  ".js", ".jsx", ".mjs", ".cjs", ".es6", ".es", ".xsjs", ".xsjslib",
                  ".ts", ".tsx", ".mts", ".cts",
                  ".htm", ".html", ".xhtm", ".xhtml", ".vue", ".hbs", ".ejs", ".njk", ".erb", ".jsp", ".dot",
              ),
              "java-kotlin": (".java",),
          }
          # Extension-less scripts: the JavaScript extractor reads those whose shebang
          # matches FileExtractor.JS_INVOCATION; Python scripts are treated the same way.
          SHEBANGS = {
              "python": re.compile(rb"\bpython[0-9.]*\b"),
              "javascript-typescript": re.compile(rb"\b(node(js)?|bun|tsx)\b"),
          }


          def git(*args, stdin=None):
              return subprocess.run(
                  ["git", "-C", os.environ["GITHUB_WORKSPACE"], *args], input=stdin, check=True, capture_output=True,
              ).stdout


          def first_lines(entries):
              """The first line of each extension-less regular file, read from the git index."""
              oids = [oid for mode, oid, name in entries if mode in ("100644", "100755") and not os.path.splitext(os.path.basename(name))[1]]
              if not oids:
                  return []
              data = git("cat-file", "--batch", stdin="".join(f"{oid}\n" for oid in oids).encode())
              lines, position = [], 0
              while position < len(data):
                  header_end = data.index(b"\n", position)
                  size = int(data[position:header_end].split()[2])
                  content = data[header_end + 1:header_end + 1 + size]
                  lines.append(content.split(b"\n", 1)[0])
                  position = header_end + 1 + size + 1
              return lines


          def has_source(language, entries, shebang_lines):
              suffixes = SOURCE_SUFFIXES.get(language)
              if suffixes is None:
                  return True
              if any(name.lower().endswith(suffixes) for _, _, name in entries):
                  return True
              pattern = SHEBANGS.get(language)
              return bool(pattern) and any(line.startswith(b"#!") and pattern.search(line) for line in shebang_lines)

          languages = json.loads(os.environ["OVERRIDE"])
          if os.environ["PLAN_NEEDED"] == "true":
              if not os.environ["PLANNED"]:
                  raise SystemExit("ci-kit plan produced no codeql output")
              languages = json.loads(os.environ["PLANNED"])
              if os.environ["BASE_NEEDED"] not in ("true", "false"):
                  raise SystemExit("the base commit plan did not run")
              if os.environ["BASE_NEEDED"] == "true":
                  if not os.environ["BASE_PLANNED"]:
                      raise SystemExit("the base commit plan produced no codeql output")
                  base_only = [language for language in json.loads(os.environ["BASE_PLANNED"]) if language not in languages]
                  if base_only:
                      entries = []
                      for record in git("ls-files", "-s", "-z").decode("utf-8", "surrogateescape").split("\0"):
                          if record:
                              meta, _, name = record.partition("\t")
                              mode, oid, _ = meta.split()
                              entries.append((mode, oid, name))
                      shebang_lines = first_lines(entries)
                  for language in base_only:
                      if has_source(language, entries, shebang_lines):
                          print(f"::notice title=CodeQL languages::{language} is analyzed because the pull request base commit declares its module.")
                          languages.append(language)
                      else:
                          print(f"::notice title=CodeQL languages::{language} is not analyzed: the base commit declares its module, but the pull request leaves no {language} source files.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"languages={json.dumps(languages, separators=(',', ':'))}\n")
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: "/language:${{ matrix.language }}"
