name: Reusable Java CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory relative to the repository root.
        type: string
        default: .
      java-version:
        type: string
        default: "17"
      distribution:
        description: JDK distribution accepted by actions/setup-java.
        type: string
        default: temurin
      build-tool:
        description: One of auto, gradle, or maven.
        type: string
        default: auto
      gradle-console:
        description: Gradle console mode for automatically generated commands; one of plain or rich.
        type: string
        default: plain
      install-command:
        description: Optional trusted setup command run before checks.
        type: string
        default: ""
      lint-command:
        description: Optional trusted check/lint command. Auto-selects a tool command when empty.
        type: string
        default: ""
      test-command:
        description: Optional trusted test command. Auto-selects a tool command when empty.
        type: string
        default: ""
      build-command:
        description: Optional trusted build command. Auto-selects a tool command when empty.
        type: string
        default: ""
      run-lint:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
      cache-dependencies:
        type: boolean
        default: true
      cache-jdk:
        description: Cache downloaded JDK installations independently of dependency caching.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 30
      upload-test-artifacts:
        description: Upload test artifacts. Disabled unless explicitly enabled.
        type: boolean
        default: false
      test-artifact-path:
        description: Path or glob to upload when upload-test-artifacts is enabled.
        type: string
        default: test-results
      test-artifact-name:
        description: Artifact name used when upload-test-artifacts is enabled.
        type: string
        default: java-test-artifacts

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out toolkit actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .toolkit
          persist-credentials: false
      - name: Resolve build tool for dependency cache
        id: cache
        env:
          BUILD_TOOL: ${{ inputs.build-tool }}
        run: |
          tool="$BUILD_TOOL"
          if [[ "$tool" == auto ]]; then
            if [[ -x ./gradlew || -f build.gradle || -f build.gradle.kts ]]; then tool=gradle
            elif [[ -f pom.xml ]]; then tool=maven
            else echo "Could not detect Gradle or Maven" >&2; exit 2
            fi
          fi
          [[ "$tool" == gradle || "$tool" == maven ]] || { echo "Unsupported build-tool: $tool" >&2; exit 2; }
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          cache: ${{ inputs.cache-dependencies && steps.cache.outputs.tool || '' }}
          cache-jdk: ${{ inputs.cache-jdk }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/**/gradle-wrapper.properties
            ${{ inputs.working-directory }}/**/*.gradle*
            ${{ inputs.working-directory }}/**/gradle.properties
            ${{ inputs.working-directory }}/**/*.versions.toml
            ${{ inputs.working-directory }}/**/pom.xml
            ${{ inputs.working-directory }}/**/.mvn/extensions.xml
      - name: Resolve build tool and commands
        id: commands
        env:
          BUILD_TOOL: ${{ inputs.build-tool }}
          GRADLE_CONSOLE: ${{ inputs.gradle-console }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          case "$GRADLE_CONSOLE" in
            plain|rich) ;;
            *) echo "Unsupported gradle-console: $GRADLE_CONSOLE (expected plain or rich)" >&2; exit 2 ;;
          esac
          tool="$BUILD_TOOL"
          if [[ "$tool" == auto ]]; then
            if [[ -x ./gradlew || -f build.gradle || -f build.gradle.kts ]]; then tool=gradle
            elif [[ -f pom.xml ]]; then tool=maven
            else echo "Could not detect Gradle or Maven" >&2; exit 2
            fi
          fi
          case "$tool" in
            gradle)
              if [[ -f ./gradlew ]]; then chmod +x ./gradlew; runner=./gradlew; else runner=gradle; fi
              [[ -n "$LINT_COMMAND" ]] || LINT_COMMAND="$runner check -x test --console=$GRADLE_CONSOLE"
              [[ -n "$TEST_COMMAND" ]] || TEST_COMMAND="$runner test --console=$GRADLE_CONSOLE"
              [[ -n "$BUILD_COMMAND" ]] || BUILD_COMMAND="$runner build --console=$GRADLE_CONSOLE"
              ;;
            maven)
              if [[ -f ./mvnw ]]; then chmod +x ./mvnw; runner=./mvnw; else runner=mvn; fi
              [[ -n "$LINT_COMMAND" ]] || LINT_COMMAND="$runner --batch-mode --no-transfer-progress validate"
              [[ -n "$TEST_COMMAND" ]] || TEST_COMMAND="$runner --batch-mode --no-transfer-progress test"
              [[ -n "$BUILD_COMMAND" ]] || BUILD_COMMAND="$runner --batch-mode --no-transfer-progress package -DskipTests"
              ;;
            *) echo "Unsupported build-tool: $tool" >&2; exit 2 ;;
          esac
          printf 'lint=%s\ntest=%s\nbuild=%s\n' "$LINT_COMMAND" "$TEST_COMMAND" "$BUILD_COMMAND" >> "$GITHUB_OUTPUT"
      - name: Project setup
        if: ${{ inputs.install-command != '' }}
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Gradle lint or check with bounded recovery
        if: ${{ inputs.run-lint && steps.cache.outputs.tool == 'gradle' }}
        uses: ./.toolkit/actions/gradle-retry
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ steps.commands.outputs.lint }}
      - name: Maven lint or check
        if: ${{ inputs.run-lint && steps.cache.outputs.tool == 'maven' }}
        env:
          COMMAND: ${{ steps.commands.outputs.lint }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Gradle test with bounded recovery
        if: ${{ inputs.run-tests && steps.cache.outputs.tool == 'gradle' }}
        uses: ./.toolkit/actions/gradle-retry
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ steps.commands.outputs.test }}
      - name: Maven test
        if: ${{ inputs.run-tests && steps.cache.outputs.tool == 'maven' }}
        env:
          COMMAND: ${{ steps.commands.outputs.test }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Gradle build with bounded recovery
        if: ${{ inputs.run-build && steps.cache.outputs.tool == 'gradle' }}
        uses: ./.toolkit/actions/gradle-retry
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ steps.commands.outputs.build }}
      - name: Maven build
        if: ${{ inputs.run-build && steps.cache.outputs.tool == 'maven' }}
        env:
          COMMAND: ${{ steps.commands.outputs.build }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload test artifacts
        if: ${{ always() && inputs.upload-test-artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.test-artifact-name }}
          path: ${{ format('{0}/{1}', inputs.working-directory, inputs.test-artifact-path) }}
          if-no-files-found: error
