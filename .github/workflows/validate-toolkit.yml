name: Validate toolkit

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-runner:
    uses: ./.github/workflows/reusable-detect-runner.yml
    with:
      strategy: ${{ github.event_name == 'pull_request' && 'pr_trusted' || 'push_any' }}
      same_repo: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
      trusted_author: ${{ github.event_name == 'pull_request' && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
      is_renovate_bot: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' }}
    secrets:
      RUNNER_DISCOVERY_TOKEN: ${{ secrets.RUNNER_DISCOVERY_TOKEN }}

  lint:
    name: Lint and static validation
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install pinned static-validation dependencies
        run: python -m pip install PyYAML==6.0.3 copier==9.18.2 jsonschema==4.26.0
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo actionlint_checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 actionlint "$HOME/.local/bin/actionlint"
      - name: Validate toolkit policies and templates
        env:
          # Lets the shared-preset coverage check read the preset through the API
          # instead of skipping on the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate.py --static
      - name: Test ruleset reconciler
        run: python tests/test_reconcile_ruleset.py
      - name: Validate Renovate configuration
        run: >-
          npx --yes --package renovate@44.132.5 renovate-config-validator
          --strict --no-global renovate/default.json .github/renovate.json
      - name: Run actionlint on toolkit and examples
        run: >-
          actionlint
          -ignore 'property "workflow_(repository|sha)" is not defined'
          .github/workflows/*.yml examples/*.yml
      - name: Check shell snippets
        run: |
          python scripts/check_action_shells.py
          mapfile -t files < <(find . -type f -name '*.sh' -print)
          if (( ${#files[@]} )); then
            shellcheck "${files[@]}"
          else
            echo "No standalone shell scripts present"
          fi
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA..$HEAD_SHA"
          fi

      - name: Smoke test shared checkout
        id: checkout-smoke
        uses: ./actions/checkout
        with:
          ref: ${{ github.sha }}
          path: .tmp/checkout-smoke
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: /README.md
          sparse-checkout-cone-mode: false
      - name: Verify shared checkout outputs and options
        env:
          CHECKOUT_COMMIT: ${{ steps.checkout-smoke.outputs.commit }}
          CHECKOUT_REF: ${{ steps.checkout-smoke.outputs.ref }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd .tmp/checkout-smoke
          test "$CHECKOUT_COMMIT" = "$EXPECTED_COMMIT"
          # Upstream clears ref for an explicit SHA and reports it via commit.
          test -z "$CHECKOUT_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -f README.md
          test ! -d actions
          if git config --local --get-regexp 'http\..*\.extraheader|core\.sshCommand|includeIf\..*\.path' >/dev/null; then
            echo 'Checkout unexpectedly persisted authentication configuration' >&2
            exit 1
          fi

  gitleaks:
    name: Gitleaks
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan Git history and current tree
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .

  python:
    name: Python fixture
    needs: [detect-runner, lint]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Compile, test, and package Python fixture
        run: python scripts/validate_python_fixture.py

  node:
    name: Node.js fixture
    needs: [detect-runner, lint]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Lint, test, and build Node.js fixture
        run: node scripts/validate_node_fixture.mjs

  java:
    name: Java fixture
    needs: [detect-runner, lint]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned template dependencies
        run: python -m pip install PyYAML==6.0.3 copier==9.18.2
      - name: Compile, test, and package Java fixture
        env:
          REQUIRE_MAVEN: "1"
        run: bash scripts/validate_java_fixture.sh

  validation-complete:
    name: Validation pipeline complete
    needs: [detect-runner, lint, gitleaks, python, node, java]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name != 'pull_request_target' }}
    timeout-minutes: 5
    steps:
      - name: Validate stage results
        shell: bash
        run: |
          if [[ "${{ needs.detect-runner.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.gitleaks.result }}" != "success" ||
                "${{ needs.python.result }}" != "success" ||
                "${{ needs.node.result }}" != "success" ||
                "${{ needs.java.result }}" != "success" ]]; then
            echo "One or more required validation stages did not succeed." >&2
            exit 1
          fi
          echo "All required validation stages completed successfully."
