name: Reusable Allure publisher

on:
  workflow_call:
    inputs:
      source-workflow:
        description: Exact workflow name that produces pull-request Allure artifacts.
        required: true
        type: string
      source-workflow-path:
        description: Repository-relative workflow path that produces the artifacts.
        required: true
        type: string
      artifact-prefix:
        description: Prefix selecting dedicated Allure result artifacts.
        required: true
        type: string
      minimum-artifacts:
        description: Minimum number of matching result artifacts; zero allows a warning skip.
        required: false
        default: 0
        type: number
      maximum-artifacts:
        description: Maximum number of matching result artifacts.
        required: false
        default: 50
        type: number
      config-file:
        description: Caller-repository Allure 3 config path.
        required: true
        type: string
      categories-file:
        description: Optional caller-repository Allure categories JSON path.
        required: false
        default: ""
        type: string
      pages-url:
        description: Optional HTTPS base URL for the report link.
        required: false
        default: ""
        type: string
      publish-pages:
        description: Publish trusted same-repository reports to GitHub Pages.
        required: false
        default: false
        type: boolean
      pages-destination-directory:
        description: Destination directory on gh-pages when publication is enabled.
        required: false
        default: ""
        type: string
      artifact-mode:
        description: external preserves nested per-job provenance; component uses the versioned pre-merged result contract.
        required: false
        default: external
        type: string
      skip-empty-artifacts:
        description: Skip an empty external result set even when the minimum is positive; partial sets still fail closed.
        required: false
        default: false
        type: boolean
      managed-pages-layout:
        description: Treat pages-url as a site base and publish below allure/pr-N with the Allure report subdirectory.
        required: false
        default: false
        type: boolean
      history-path:
        description: Workspace-relative <directory>/<file>.jsonl equal to the Allure config historyPath; restores and persists per-PR history. Empty disables history transport.
        required: false
        default: ""
        type: string
    secrets:
      github-token:
        description: Optional legacy token override. Prefer the per-job github.token default; a custom token cannot be attenuated by job permissions.
        required: false

permissions: {}

concurrency:
  group: allure-publisher-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report:
    uses: ./.github/workflows/allure-publisher-core.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      source-workflow: ${{ inputs.source-workflow }}
      source-workflow-path: ${{ inputs.source-workflow-path }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      minimum-artifacts: ${{ inputs.minimum-artifacts }}
      maximum-artifacts: ${{ inputs.maximum-artifacts }}
      config-file: ${{ inputs.config-file }}
      categories-file: ${{ inputs.categories-file }}
      pages-url: ${{ inputs.pages-url }}
      publish-pages: ${{ inputs.publish-pages }}
      artifact-mode: ${{ inputs.artifact-mode }}
      skip-empty-artifacts: ${{ inputs.skip-empty-artifacts }}
      managed-pages-layout: ${{ inputs.managed-pages-layout }}
      history-path: ${{ inputs.history-path }}
    secrets:
      github-token: ${{ secrets.github-token }}
  pages:
    needs: report
    if: ${{ inputs.publish-pages && needs.report.outputs.ready == 'true' && needs.report.outputs.fork-pr == 'false' }}
    uses: ./.github/workflows/allure-pages.yml
    permissions:
      actions: read
      contents: write
      pull-requests: read
    with:
      source-workflow: ${{ inputs.source-workflow }}
      source-workflow-path: ${{ inputs.source-workflow-path }}
      managed-pages-layout: ${{ inputs.managed-pages-layout }}
      pr-number: ${{ needs.report.outputs.pr-number }}
      pages-destination-directory: ${{ inputs.managed-pages-layout && format('allure/pr-{0}', needs.report.outputs.pr-number) || inputs.pages-destination-directory }}
    secrets:
      github-token: ${{ secrets.github-token }}
