name: Validate

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      java: ${{ steps.plan.outputs.java }}
      python: ${{ steps.plan.outputs.python }}
      node: ${{ steps.plan.outputs.node }}
      docker: ${{ steps.plan.outputs.docker }}
      codes: ${{ steps.plan.outputs.codes }}
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .toolkit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install ci-kit
        run: python -m pip install ./.toolkit
      - name: Plan modules
        id: plan
        run: ci-kit plan --repo . --github-output "$GITHUB_OUTPUT"

  core-checks:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.modules), 'core')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo actionlint_checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 actionlint "$RUNNER_TEMP/bin/actionlint"
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/*.yml
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA..$HEAD_SHA"
          fi

  java:
    name: java (${{ matrix.component.name }})
    needs: plan
    if: needs.plan.outputs.java != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.java) }}
    uses: ./.github/workflows/java-ci.yml
    with:
      working-directory: ${{ matrix.component.path }}
      build-command: ${{ matrix.component.build_command }}
      build-tool: ${{ matrix.component.build_tool }}
      cache-dependencies: ${{ matrix.component.cache_dependencies }}
      cache-jdk: ${{ matrix.component.cache_jdk }}
      distribution: ${{ matrix.component.distribution }}
      gradle-console: ${{ matrix.component.gradle_console }}
      install-command: ${{ matrix.component.install_command }}
      java-version: ${{ matrix.component.java_version }}
      lint-command: ${{ matrix.component.lint_command }}
      run-build: ${{ matrix.component.run_build }}
      run-lint: ${{ matrix.component.run_lint }}
      run-tests: ${{ matrix.component.run_tests }}
      test-artifact-name: ${{ matrix.component.test_artifact_name }}
      test-artifact-path: ${{ matrix.component.test_artifact_path }}
      test-command: ${{ matrix.component.test_command }}
      test-modules: ${{ matrix.component.test_modules }}
      timeout-minutes: ${{ matrix.component.timeout_minutes }}
      upload-test-artifacts: ${{ matrix.component.upload_test_artifacts }}

  python:
    name: python (${{ matrix.component.name }})
    needs: plan
    if: needs.plan.outputs.python != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.python) }}
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: ${{ matrix.component.path }}
      build-command: ${{ matrix.component.build_command }}
      cache-dependencies: ${{ matrix.component.cache_dependencies }}
      install-command: ${{ matrix.component.install_command }}
      lint-command: ${{ matrix.component.lint_command }}
      package-manager: ${{ matrix.component.package_manager }}
      pip-version: ${{ matrix.component.pip_version }}
      poetry-version: ${{ matrix.component.poetry_version }}
      python-version: ${{ matrix.component.python_version }}
      requirements-file: ${{ matrix.component.requirements_file }}
      run-build: ${{ matrix.component.run_build }}
      run-lint: ${{ matrix.component.run_lint }}
      run-tests: ${{ matrix.component.run_tests }}
      test-artifact-name: ${{ matrix.component.test_artifact_name }}
      test-artifact-path: ${{ matrix.component.test_artifact_path }}
      test-command: ${{ matrix.component.test_command }}
      timeout-minutes: ${{ matrix.component.timeout_minutes }}
      upload-test-artifacts: ${{ matrix.component.upload_test_artifacts }}
      uv-version: ${{ matrix.component.uv_version }}

  node:
    name: node (${{ matrix.component.name }})
    needs: plan
    if: needs.plan.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.node) }}
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: ${{ matrix.component.path }}
      build-command: ${{ matrix.component.build_command }}
      cache-dependencies: ${{ matrix.component.cache_dependencies }}
      corepack-version: ${{ matrix.component.corepack_version }}
      install-command: ${{ matrix.component.install_command }}
      lint-command: ${{ matrix.component.lint_command }}
      node-version: ${{ matrix.component.node_version }}
      package-manager: ${{ matrix.component.package_manager }}
      run-build: ${{ matrix.component.run_build }}
      run-lint: ${{ matrix.component.run_lint }}
      run-tests: ${{ matrix.component.run_tests }}
      test-artifact-name: ${{ matrix.component.test_artifact_name }}
      test-artifact-path: ${{ matrix.component.test_artifact_path }}
      test-command: ${{ matrix.component.test_command }}
      timeout-minutes: ${{ matrix.component.timeout_minutes }}
      upload-test-artifacts: ${{ matrix.component.upload_test_artifacts }}

  docker:
    name: docker (${{ matrix.component.name }})
    needs: plan
    if: needs.plan.outputs.docker != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.docker) }}
    uses: ./.github/workflows/docker-build.yml
    with:
      context: ${{ matrix.component.context }}
      dockerfile: ${{ matrix.component.dockerfile }}
      target: ${{ matrix.component.target }}
      push: false

  gate:
    needs: [plan, core-checks, java, python, node, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .toolkit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install ci-kit
        run: python -m pip install ./.toolkit
      - name: Fetch job results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate --jq '.jobs[]' "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > jobs.raw; then
            if jq -s . jobs.raw > jobs.tmp; then
              mv jobs.tmp jobs.json
            fi
          fi
      - name: Evaluate gate
        env:
          ENABLED: ${{ needs.plan.outputs.modules }}
          PLAN_CODES: ${{ needs.plan.outputs.codes }}
          TEMPLATE_COMMITS: ${{ needs.plan.outputs.commits }}
          NEEDS: ${{ toJSON(needs) }}
          TOOLKIT_REF: ${{ job.workflow_sha }}
        run: |
          empty_object='{}'
          args=()
          if [[ -f jobs.json ]]; then args+=(--jobs-file jobs.json); fi
          ci-kit gate --enabled "${ENABLED:-[]}" --needs "$NEEDS" "${args[@]}" --plan-codes "${PLAN_CODES:-[]}" --template-commits "${TEMPLATE_COMMITS:-$empty_object}" --ref "$TOOLKIT_REF" --summary "$GITHUB_STEP_SUMMARY"
