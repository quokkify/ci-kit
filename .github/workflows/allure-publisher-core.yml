name: Reusable Allure report core
on:
  workflow_call:
    inputs:
      source-workflow:
        description: Exact workflow name that produces pull-request Allure artifacts.
        required: true
        type: string
      source-workflow-path:
        description: Repository-relative workflow path that produces the artifacts.
        required: true
        type: string
      artifact-prefix:
        description: Prefix selecting dedicated Allure result artifacts.
        required: true
        type: string
      minimum-artifacts:
        description: Minimum number of matching result artifacts; zero allows a warning skip.
        required: false
        default: 0
        type: number
      maximum-artifacts:
        description: Maximum number of matching result artifacts.
        required: false
        default: 50
        type: number
      config-file:
        description: Caller-repository Allure 3 config path.
        required: true
        type: string
      categories-file:
        description: Optional caller-repository Allure categories JSON path.
        required: false
        default: ''
        type: string
      pages-url:
        description: Optional HTTPS base URL for the report link.
        required: false
        default: ''
        type: string
      publish-pages:
        description: Publish trusted same-repository reports to GitHub Pages.
        required: false
        default: false
        type: boolean
      artifact-mode:
        description: external preserves nested per-job provenance; component uses the versioned pre-merged result contract.
        required: false
        default: external
        type: string
      skip-empty-artifacts:
        description: Skip an empty external result set even when the minimum is positive; partial sets still fail closed.
        required: false
        default: false
        type: boolean
      managed-pages-layout:
        description: Treat pages-url as a site base and publish below allure/pr-N with the Allure report subdirectory.
        required: false
        default: false
        type: boolean
    outputs:
      ready:
        description: Source identity and artifacts passed the resolver contract.
        value: ${{ jobs.resolve.outputs.ready }}
      pr-number:
        description: Exactly one current open pull request matched the source head.
        value: ${{ jobs.resolve.outputs.pr-number }}
      fork-pr:
        description: True for fork or Dependabot sources which must not publish Pages.
        value: ${{ jobs.resolve.outputs.fork-pr }}
      report-artifact-name:
        description: Exact generated report artifact for this trusted report run.
        value: ${{ jobs.generate.outputs.report-artifact-name }}
      report-artifact-id:
        description: Immutable generated report artifact identifier.
        value: ${{ jobs.generate.outputs.report-artifact-id }}
    secrets:
      github-token:
        description: Optional legacy token override. Prefer the per-job github.token default; a custom token cannot be attenuated by job permissions.
        required: false
permissions: {}
concurrency:
  group: allure-publisher-core-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Resolve trusted source run
    if: |-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        contains(
          fromJSON('["success","failure","neutral","timed_out"]'),
          github.event.workflow_run.conclusion
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      fork-pr: ${{ steps.resolve.outputs.fork-pr }}
      artifact_manifest: ${{ steps.resolve.outputs.artifact_manifest }}
      materialize-root: ${{ steps.resolve.outputs.materialize-root }}
      source-artifacts-directory: ${{ steps.resolve.outputs.source-artifacts-directory }}
    steps:
    - name: Resolve PR and validate source artifacts
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const run = context.payload.workflow_run;
          const artifactPrefix = process.env.ARTIFACT_PREFIX;
          const minimumArtifacts = Number(process.env.MINIMUM_ARTIFACTS);
          const maximumArtifacts = Number(process.env.MAXIMUM_ARTIFACTS);
          const componentMode = process.env.ARTIFACT_MODE === "component";
          const externalMode = process.env.ARTIFACT_MODE === "external";
          const materializeRoot = componentMode ? ".allure-input/results" : ".allure-input/source-artifacts";
          const sourceArtifactsDirectory = componentMode ? "" : ".allure-input/source-artifacts";
          const skip = (message) => {
            core.warning(message);
            core.setOutput("ready", "false");
          };
          if ((!componentMode && !externalMode) || !artifactPrefix ||
              !Number.isInteger(minimumArtifacts) || minimumArtifacts < 0 ||
              !Number.isInteger(maximumArtifacts) || maximumArtifacts < Math.max(1, minimumArtifacts) || maximumArtifacts > 50) {
            core.setFailed("Invalid Allure artifact mode, prefix, or count bounds.");
            return;
          }
          const componentRun = componentMode;
          const externalRun = externalMode;
          if (run.name !== process.env.SOURCE_WORKFLOW || run.path !== process.env.SOURCE_WORKFLOW_PATH) {
            skip(`Ignore unexpected source workflow identity: ${run.name} (${run.path}).`);
            return;
          }
          const headRepository = run.head_repository?.full_name;
          if (!headRepository || !run.head_sha) {
            skip("Source run has no live head repository or SHA.");
            return;
          }
          const pulls = await github.paginate(github.rest.pulls.list, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: "open",
            per_page: 100,
          });
          const matches = pulls.filter((pull) =>
            pull.base?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
            pull.head?.repo?.full_name === headRepository &&
            pull.head?.sha === run.head_sha
          );
          if (matches.length !== 1) {
            skip(`Expected exactly one current open PR for source SHA; found ${matches.length}.`);
            return;
          }
          const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: run.workflow_id,
            event: "pull_request",
            head_sha: run.head_sha,
            per_page: 100,
          });
          const newestRunId = Math.max(...sourceRuns.map((candidate) => Number(candidate.id)));
          const currentRun = sourceRuns.find((candidate) => Number(candidate.id) === Number(run.id));
          if (!Number.isSafeInteger(newestRunId) || Number(run.id) !== newestRunId ||
              Number(currentRun?.run_attempt || 1) !== Number(run.run_attempt || 1)) {
            skip("A newer source workflow run exists for this PR head; stale report suppressed.");
            return;
          }
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: run.id,
            per_page: 100,
          });
          const allureArtifacts = artifacts.filter((artifact) =>
            artifact.name.startsWith(componentRun ? "allure-results-" : artifactPrefix)
          );
          const actualNames = allureArtifacts.map((artifact) => artifact.name).sort();
          // The source run is authoritative for component artifact identities.  The
          // trusted report workflow may be updated before a consumer's source run,
          // so matching against this workflow's current component IDs would drop
          // reports during a migration.  Keep the contract versioned and strict
          // without coupling it to the report workflow's component inventory.
          const sourceArtifactContractVersion = 1;
          const componentArtifactPattern = /^allure-results-[A-Za-z_][A-Za-z0-9_-]*$/;
          if (componentRun && (sourceArtifactContractVersion !== 1 || actualNames.length === 0 || actualNames.length > maximumArtifacts ||
              actualNames.some((name) => !componentArtifactPattern.test(name)) ||
              new Set(actualNames).size !== actualNames.length)) {
            core.setFailed(`Allure artifact contract v${sourceArtifactContractVersion} mismatch; received ${actualNames.join(", ") || "none"}.`);
            return;
          }
          if (externalRun && actualNames.length === 0 &&
              (minimumArtifacts === 0 || process.env.SKIP_EMPTY_ARTIFACTS === "true")) {
            skip("No external Allure artifacts found; report generation skipped.");
            return;
          }
          if (externalRun && (actualNames.length < minimumArtifacts || actualNames.length > maximumArtifacts ||
              new Set(actualNames).size !== actualNames.length)) {
            core.setFailed(`External Allure artifact contract mismatch. Expected ${minimumArtifacts}-${maximumArtifacts} unique artifacts with prefix ${artifactPrefix}; received ${actualNames.length}.`);
            return;
          }
          if (allureArtifacts.some((artifact) => !Number.isSafeInteger(Number(artifact.id)) || Number(artifact.id) <= 0 ||
              !Number.isSafeInteger(Number(artifact.size_in_bytes)) || Number(artifact.size_in_bytes) < 0 ||
              !/^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(artifact.name)) ||
              new Set(allureArtifacts.map((artifact) => Number(artifact.id))).size !== allureArtifacts.length) {
            core.setFailed("Allure artifact identity, name, or compressed-size metadata is invalid.");
            return;
          }
          if (allureArtifacts.some((artifact) => artifact.expired)) {
            core.setFailed("One or more required Allure artifacts have expired.");
            return;
          }
          const compressedBytes = allureArtifacts.reduce(
            (total, artifact) => total + Number(artifact.size_in_bytes || 0),
            0,
          );
          if (compressedBytes > 262144000) {
            core.setFailed(`Allure artifacts exceed the 250 MiB compressed limit: ${compressedBytes} bytes.`);
            return;
          }
          core.setOutput("artifact_manifest", JSON.stringify(
            allureArtifacts.map((artifact) => ({
              name: artifact.name,
              id: Number(artifact.id),
            }))
          ));
          core.setOutput("materialize-root", materializeRoot);
          core.setOutput("source-artifacts-directory", sourceArtifactsDirectory);
          const pull = matches[0];
          core.setOutput("ready", "true");
          core.setOutput("pr-number", String(pull.number));
          const pagesUnsafe = pull.head.repo.full_name !== pull.base.repo.full_name ||
            pull.user?.login === "dependabot[bot]";
          core.setOutput("fork-pr", String(pagesUnsafe));
        github-token: ${{ secrets.github-token || github.token }}
      env:
        SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
        SOURCE_WORKFLOW_PATH: ${{ inputs.source-workflow-path }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        MINIMUM_ARTIFACTS: ${{ inputs.minimum-artifacts }}
        MAXIMUM_ARTIFACTS: ${{ inputs.maximum-artifacts }}
        ARTIFACT_MODE: ${{ inputs.artifact-mode }}
        SKIP_EMPTY_ARTIFACTS: ${{ inputs.skip-empty-artifacts }}
  download:
    name: Download validated Allure artifacts
    needs: resolve
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
    - name: Check out trusted toolkit extractor
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .toolkit
        persist-credentials: false
    - name: Download, preflight, and merge Allure results
      shell: bash
      env:
        ARTIFACT_MANIFEST: ${{ needs.resolve.outputs.artifact_manifest }}
        API_URL: ${{ github.api_url }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.github-token || github.token }}
        ARCHIVE_ROOT: ${{ runner.temp }}/allure-archives
        OUTPUT_ROOT: ${{ runner.temp }}/allure-expanded
        MATERIALIZE_ROOT: ${{ github.workspace }}/${{ needs.resolve.outputs.materialize-root }}
      run: python .toolkit/templates/project/template/.github/allure/safe_extract.py.jinja
    - name: Upload validated source bundle for the generator
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: allure-source-${{ github.run_id }}
        path: ${{ needs.resolve.outputs.materialize-root }}
        if-no-files-found: error
        retention-days: 1
  generate:
    name: Generate unprivileged report
    needs:
    - resolve
    - download
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
    - name: Check out trusted report configuration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Download validated source bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: allure-source-${{ github.run_id }}
        path: ${{ needs.resolve.outputs.materialize-root }}
        github-token: ${{ secrets.github-token || github.token }}
        run-id: ${{ github.run_id }}
    - name: Build report without write privileges
      uses: quokkify/allure-report-action@b2a25adb4d080b2c56f5342ef1f69976163590d7 # v0.5.2
      with:
        github-token: ${{ secrets.github-token || github.token }}
        results-directory: .allure-input/results
        source-artifacts-directory: ${{ needs.resolve.outputs.source-artifacts-directory }}
        report-directory: allure-report
        config-file: ${{ inputs.config-file }}
        source-run-id: ${{ github.event.workflow_run.id }}
        pages-url: ${{ inputs.managed-pages-layout && inputs.publish-pages && format('{0}/allure/pr-{1}/allure-report/', inputs.pages-url, needs.resolve.outputs.pr-number) || inputs.pages-url
          }}
        fork-pr: ${{ needs.resolve.outputs.fork-pr }}
        comment-marker: <!-- project-toolkit-allure-report -->
        categories-file: ${{ inputs.categories-file }}
        comment-file: allure-pr-comment.md
        pr-number: ''
    - name: Upload generated Allure HTML
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: allure-report-${{ github.run_id }}
        path: |
          allure-report
          allure-pr-comment.md
        if-no-files-found: error
        retention-days: 14
      id: upload
    outputs:
      report-artifact-name: allure-report-${{ github.run_id }}
      report-artifact-id: ${{ steps.upload.outputs.artifact-id }}
  comment:
    name: Publish trusted PR comment
    needs:
    - resolve
    - generate
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
    - name: Download generated report and compact comment
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: allure-report-${{ github.run_id }}
        path: .allure-generated
        github-token: ${{ secrets.github-token || github.token }}
        run-id: ${{ github.run_id }}
    - name: Revalidate source freshness and update comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
      with:
        script: |
          const run = context.payload.workflow_run;
          const prNumber = Number(process.env.PR_NUMBER);
          const { data: pull } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          });
          if (pull.state !== "open" || pull.head?.sha !== run.head_sha ||
              pull.head?.repo?.full_name !== run.head_repository?.full_name) {
            core.warning("PR head changed; stale Allure comment suppressed.");
            return;
          }
          const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: run.workflow_id,
            event: "pull_request",
            head_sha: run.head_sha,
            per_page: 100,
          });
          const currentRun = sourceRuns.find((candidate) => Number(candidate.id) === Number(run.id));
          if (Number(run.id) !== Math.max(...sourceRuns.map((candidate) => Number(candidate.id))) ||
              Number(currentRun?.run_attempt || 1) !== Number(run.run_attempt || 1)) {
            core.warning("A newer source workflow run exists; stale Allure comment suppressed.");
            return;
          }
          const marker = "<!-- project-toolkit-allure-report -->";
          const body = require("fs").readFileSync(".allure-generated/allure-pr-comment.md", "utf8").trimEnd();
          if ((body.match(new RegExp(marker, "g")) || []).length !== 1 || !body.endsWith(marker)) {
            core.setFailed("Generated Allure comment must contain exactly one marker as its final line.");
            return;
          }
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100,
          });
          const existing = comments.find((comment) =>
            comment.user?.login === "github-actions[bot]" && (comment.body || "").includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
        github-token: ${{ secrets.github-token || github.token }}
