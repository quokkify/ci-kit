name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory relative to the repository root.
        type: string
        default: .
      node-version:
        description: Node.js version accepted by actions/setup-node.
        type: string
        default: "22"
      package-manager:
        description: One of auto, npm, pnpm, or yarn.
        type: string
        default: auto
      corepack-version:
        description: Exact Corepack version used for pnpm and Yarn.
        type: string
        default: "0.34.0"
      install-command:
        description: Optional trusted shell command overriding dependency installation.
        type: string
        default: ""
      lint-command:
        description: Trusted lint command.
        type: string
        default: "npm run lint"
      test-command:
        description: Trusted test command.
        type: string
        default: "npm test"
      build-command:
        description: Optional trusted build command.
        type: string
        default: "npm run build"
      run-lint:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      run-build:
        description: Disabled by default because not every Node.js project has a build.
        type: boolean
        default: false
      cache-dependencies:
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 20
      upload-test-artifacts:
        description: Upload test artifacts. Disabled unless explicitly enabled.
        type: boolean
        default: false
      test-artifact-path:
        description: Path or glob to upload when upload-test-artifacts is enabled.
        type: string
        default: test-results
      test-artifact-name:
        description: Artifact name used when upload-test-artifacts is enabled.
        type: string
        default: node-test-artifacts

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs
        shell: bash
        working-directory: .
        env:
          CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
          INSTALL_DEPENDENCIES: "true"
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          for input in "cache-dependencies=$CACHE_DEPENDENCIES" "install-dependencies=$INSTALL_DEPENDENCIES"; do
            name=${input%%=*}
            value=${input#*=}
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "$name must be 'true' or 'false': $value" >&2
              exit 2
            fi
          done
          case "$PACKAGE_MANAGER" in
            auto|npm|pnpm|yarn) ;;
            *) echo "Unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
          esac
      - name: Set up Node.js
        id: runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Prepare Node.js package manager
        id: manager
        shell: bash
        working-directory: .
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          COREPACK_VERSION: ${{ inputs.corepack-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          manager="$PACKAGE_MANAGER"
          if [[ -n "$INSTALL_COMMAND" ]]; then
            # Custom installers own their tooling; retain only the runtime package cache.
            manager=npm
          fi
          if [[ "$manager" == auto ]]; then
            if [[ -f pnpm-lock.yaml ]]; then manager=pnpm
            elif [[ -f yarn.lock ]]; then manager=yarn
            else manager=npm
            fi
          fi
          classic=false
          if [[ "$manager" == yarn ]] && grep -q '^# yarn lockfile v1' yarn.lock 2>/dev/null; then
            classic=true
          fi
          if [[ "$manager" != npm ]]; then
            if [[ "$classic" != true ]]; then
              # Parse JSON rather than matching arbitrary nested keys or text.
              PACKAGE_MANAGER="$manager" node -e '
                const p = require(process.cwd() + "/package.json");
                const name = process.env.PACKAGE_MANAGER;
                if (typeof p.packageManager !== "string" || !p.packageManager.startsWith(name + "@")) {
                  throw new Error(name + " projects must pin packageManager in package.json");
                }
              '
            fi
            [[ "$COREPACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "corepack-version must be an exact version" >&2; exit 2;
            }
            # Install outside the project and do not depend on bundled Corepack or runner shims.
            tool_dir="$(mktemp -d "$RUNNER_TEMP/toolkit-corepack.XXXXXX")"
            npm install --prefix "$tool_dir" --no-package-lock --ignore-scripts --engine-strict "corepack@$COREPACK_VERSION"
            tool_bin="$tool_dir/node_modules/.bin"
            export PATH="$tool_bin:$PATH"
            echo "$tool_bin" >> "$GITHUB_PATH"
            corepack enable --install-directory "$tool_bin"
            if [[ "$classic" == true ]]; then
              corepack prepare yarn@1.22.22 --activate
            fi
          fi
          version="$($manager --version)"
          {
            echo "name=$manager"
            echo "classic=$classic"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          if [[ "$CACHE_DEPENDENCIES" == true ]]; then
            case "$manager" in
              npm) cache_path="$(npm config get cache)" ;;
              pnpm) cache_path="$(pnpm store path --silent)" ;;
              yarn)
                if [[ "$classic" == true ]]; then cache_path="$(yarn cache dir)"
                else cache_path="$(yarn config get cacheFolder)"
                fi
                ;;
            esac
            [[ -n "$cache_path" && "$cache_path" != *$'\n'* ]] || { echo "Invalid cache path" >&2; exit 2; }
            echo "cache-path=$cache_path" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Node.js dependencies
        if: ${{ inputs.cache-dependencies }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.manager.outputs.cache-path }}
          key: node-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node-version }}-${{ steps.manager.outputs.name }}-${{ steps.manager.outputs.version }}-${{ hashFiles(format('{0}/**/package-lock.json', inputs.working-directory), format('{0}/**/npm-shrinkwrap.json', inputs.working-directory), format('{0}/**/pnpm-lock.yaml', inputs.working-directory), format('{0}/**/yarn.lock', inputs.working-directory)) }}
          restore-keys: |
            node-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node-version }}-${{ steps.manager.outputs.name }}-${{ steps.manager.outputs.version }}-
      - name: Install Node.js dependencies
        shell: bash
        working-directory: .
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ steps.manager.outputs.name }}
          TOOLKIT_YARN_CLASSIC: ${{ steps.manager.outputs.classic }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ -n "$INSTALL_COMMAND" ]]; then
            bash -euo pipefail -c "$INSTALL_COMMAND"
            exit 0
          fi
          case "$PACKAGE_MANAGER" in
            npm)
              if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then npm ci
              else npm install
              fi
              ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if [[ "$TOOLKIT_YARN_CLASSIC" == true ]]; then yarn install --frozen-lockfile
              else yarn install --immutable
              fi
              ;;
          esac
      - name: Lint
        if: ${{ inputs.run-lint }}
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: ${{ inputs.run-build && inputs.build-command != '' }}
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload test artifacts
        if: ${{ always() && inputs.upload-test-artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test-artifact-name }}
          path: ${{ format('{0}/{1}', inputs.working-directory, inputs.test-artifact-path) }}
          if-no-files-found: error
