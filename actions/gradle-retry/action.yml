name: Gradle command with bounded retry
description: Run a Gradle command with bounded repository HTTP 403/429 retries and one dependency refresh recovery.

inputs:
  command:
    description: Trusted Gradle command to execute.
    required: true
  working-directory:
    description: Project directory relative to the repository root.
    required: false
    default: .
  max-attempts:
    description: Maximum attempts for transient repository HTTP 403/429 failures.
    required: false
    default: "3"
  initial-delay-seconds:
    description: Initial delay before a transient repository HTTP 403/429 retry. Zero disables waiting in tests.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Run Gradle command with bounded recovery
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_RETRY_COMMAND: ${{ inputs.command }}
        GRADLE_RETRY_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        GRADLE_RETRY_INITIAL_DELAY_SECONDS: ${{ inputs.initial-delay-seconds }}
      run: |
        # shellcheck disable=SC2034
        export GRADLE_RETRY_COMMAND GRADLE_RETRY_MAX_ATTEMPTS GRADLE_RETRY_INITIAL_DELAY_SECONDS
        bash "${GITHUB_ACTION_PATH}/gradle-retry.sh"
