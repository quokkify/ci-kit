name: Gradle command with bounded retry
description: Run a Gradle command with bounded retries for repository HTTP 403/429, plugin resolution, and Maven Central or Plugin Portal not-found failures, using one dependency refresh attempt.

inputs:
  command:
    description: Trusted Gradle command to execute.
    required: true
  working-directory:
    description: Project directory relative to the repository root.
    required: false
    default: .
  max-attempts:
    description: Maximum attempts for transient repository HTTP 403/429, plugin resolution, and Maven Central or Plugin Portal not-found failures.
    required: false
    default: "4"
  initial-delay-seconds:
    description: Initial delay before a transient failure retry; each later delay is three times longer, plus up to one third jitter. Zero disables waiting in tests.
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Run Gradle command with bounded recovery
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_RETRY_COMMAND: ${{ inputs.command }}
        GRADLE_RETRY_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        GRADLE_RETRY_INITIAL_DELAY_SECONDS: ${{ inputs.initial-delay-seconds }}
      run: |
        # shellcheck disable=SC2034
        export GRADLE_RETRY_COMMAND GRADLE_RETRY_MAX_ATTEMPTS GRADLE_RETRY_INITIAL_DELAY_SECONDS
        bash "${GITHUB_ACTION_PATH}/gradle-retry.sh"
