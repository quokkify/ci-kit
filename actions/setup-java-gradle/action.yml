name: Setup Java + Gradle wrapper
description: Prepare Java and Java/Gradle caches.

inputs:
  java-version:
    description: Java version accepted by actions/setup-java.
    required: false
    default: "17"
  distribution:
    description: JDK distribution accepted by actions/setup-java.
    required: false
    default: temurin
  working-directory:
    description: Repository subpath where Gradle build files are located.
    required: false
    default: .
  cache-dependencies:
    description: Cache Java and Gradle local caches.
    required: false
    default: "true"
  cache-jdk:
    description: Cache downloaded JDK installations independently of dependency caching.
    required: false
    default: "true"
  validate-wrappers:
    description: Validate repository-contained Gradle Wrapper JAR files before setup.
    required: false
    default: "true"

outputs:
  gradle-command:
    description: Workspace-relative wrapper path or gradle; retained for compatibility. Prefer gradle-project-command for nested projects.
    value: ${{ steps.resolve.outputs.gradle-command }}
  gradle-project-command:
    description: Shell-escaped Gradle command with an absolute project directory; run through Bash from any directory.
    value: ${{ steps.resolve.outputs.gradle-project-command }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
        CACHE_JDK: ${{ inputs.cache-jdk }}
        VALIDATE_WRAPPERS: ${{ inputs.validate-wrappers }}
      run: |
        set -euo pipefail
        if [[ "$CACHE_DEPENDENCIES" != "true" && "$CACHE_DEPENDENCIES" != "false" ]]; then
          echo "cache-dependencies must be 'true' or 'false': $CACHE_DEPENDENCIES" >&2
          exit 2
        fi
        if [[ "$CACHE_JDK" != "true" && "$CACHE_JDK" != "false" ]]; then
          echo "cache-jdk must be 'true' or 'false': $CACHE_JDK" >&2
          exit 2
        fi
        if [[ "$VALIDATE_WRAPPERS" != "true" && "$VALIDATE_WRAPPERS" != "false" ]]; then
          echo "validate-wrappers must be 'true' or 'false': $VALIDATE_WRAPPERS" >&2
          exit 2
        fi
    - name: Validate Gradle wrappers
      if: ${{ inputs.validate-wrappers == 'true' }}
      uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.cache-dependencies == 'true' && 'gradle' || '' }}
        cache-jdk: ${{ inputs.cache-jdk }}
        cache-dependency-path: |
          ${{ inputs.working-directory }}/**/gradle-wrapper.properties
          ${{ inputs.working-directory }}/**/*.gradle*
          ${{ inputs.working-directory }}/**/gradle.properties
          ${{ inputs.working-directory }}/**/*.versions.toml
    - name: Resolve Gradle wrapper command
      id: resolve
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        project_directory="$(cd "$WORKING_DIRECTORY" && pwd -P)"
        wrapper="$project_directory/gradlew"
        if [[ -f "$wrapper" ]]; then
          chmod +x "$wrapper"
          runner="$wrapper"
          echo "gradle-command=$WORKING_DIRECTORY/gradlew" >> "$GITHUB_OUTPUT"
        else
          runner=gradle
          echo "gradle-command=gradle" >> "$GITHUB_OUTPUT"
        fi
        printf -v command '%q --project-dir %q' "$runner" "$project_directory"
        echo "gradle-project-command=$command" >> "$GITHUB_OUTPUT"
