name: Compose up with readiness
description: Start Docker Compose services through the standalone health engine and optionally wait for HTTP readiness.

author: Yaraslau Lazakovich

inputs:
  compose-files:
    description: Newline-separated Compose files relative to working-directory.
    required: false
    default: docker-compose.yml
  working-directory:
    description: Repository subpath containing the Compose files.
    required: false
    default: .
  services:
    description: Space- or comma-separated services to check.
    required: false
    default: ""
  profiles:
    description: Space-, comma-, or newline-separated Compose profiles.
    required: false
    default: ""
  before-compose-hook:
    description: Optional Bash file relative to working-directory, sourced before Compose startup.
    required: false
    default: ""
  after-health-hook:
    description: Optional Bash file relative to working-directory, sourced after container health checks.
    required: false
    default: ""
  completed-services:
    description: Space- or comma-separated one-shot services to check for successful exit.
    required: false
    default: ""
  build:
    description: Build images while bringing services up.
    required: false
    default: "false"
  additional-compose-args:
    description: Additional arguments for the Compose startup command, such as --quiet-pull.
    required: false
    default: ""
  wait-for-health:
    description: Retained for compatibility; v2 requires the standalone health engine.
    required: false
    default: "true"
  wait-urls:
    description: Newline-separated absolute HTTP(S) URLs that must return a successful response.
    required: false
    default: ""
  timeout-seconds:
    description: Standalone and HTTP readiness timeout from 1 through 86400 seconds.
    required: false
    default: "120"
  url-timeout-seconds:
    description: Maximum timeout for each HTTP readiness probe, from 1 through 300 seconds.
    required: false
    default: "5"
  show-logs-on-failure:
    description: Retained for compatibility; v2 always uses standalone failure diagnostics.
    required: false
    default: "true"
  down-on-timeout:
    description: Run compose-file-scoped docker compose down after standalone or HTTP readiness failure.
    required: false
    default: "false"

outputs:
  summary_b64:
    description: Base64-encoded standalone healthcheck summary.
    value: ${{ steps.compose-health.outputs.summary_b64 }}
  report_json_b64:
    description: Base64-encoded standalone JSON healthcheck report when available.
    value: ${{ steps.compose-health.outputs.report_json_b64 }}

runs:
  using: composite
  steps:
    - name: Validate Compose inputs
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
        BEFORE_COMPOSE_HOOK: ${{ inputs.before-compose-hook }}
        AFTER_HEALTH_HOOK: ${{ inputs.after-health-hook }}
        COMPLETED_SERVICES: ${{ inputs.completed-services }}
        COMPOSE_FILES: ${{ inputs.compose-files }}
        DOWN_ON_TIMEOUT: ${{ inputs.down-on-timeout }}
        SERVICES: ${{ inputs.services }}
        PROFILES: ${{ inputs.profiles }}
        SHOW_LOGS_ON_FAILURE: ${{ inputs.show-logs-on-failure }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        URL_TIMEOUT_SECONDS: ${{ inputs.url-timeout-seconds }}
        WAIT_FOR_HEALTH: ${{ inputs.wait-for-health }}
        WAIT_URLS: ${{ inputs.wait-urls }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        command_text() {
          local value="${1//"%"/%25}"
          value="${value//$'\r'/%0D}"
          printf '%s' "${value//$'\n'/%0A}"
        }

        fail() {
          printf '%s\n' "$(command_text "$1")" >&2
          exit 2
        }

        requires_linux() {
          [[ "${RUNNER_OS:-Linux}" == "Linux" ]] || fail "compose-up supports Linux runners only"
        }

        validate_boolean() {
          local name="$1"
          local value="$2"
          [[ "$value" == "true" || "$value" == "false" ]] || fail "$name must be 'true' or 'false': $value"
        }

        normalize_positive_int() {
          local name="$1"
          local value="$2"
          local max="$3"
          local zero_prefix
          local normalized

          [[ "$value" =~ ^[0-9]+$ ]] || fail "$name must be a positive integer from 1 through $max"
          (( ${#value} <= 20 )) || fail "$name must be an integer from 1 through $max"
          zero_prefix="${value%%[!0]*}"
          normalized="${value#"$zero_prefix"}"
          [[ -n "$normalized" ]] || normalized=0
          [[ "$normalized" != "0" ]] || fail "$name must be an integer from 1 through $max"
          (( ${#normalized} <= ${#max} )) || fail "$name must be an integer from 1 through $max"
          (( 10#$normalized <= 10#$max )) || fail "$name must be an integer from 1 through $max"
          printf '%s' "$normalized"
        }

        validate_relative_path() {
          local value="$1"
          local description="$2"

          if [[ "$value" =~ [[:cntrl:]] ]]; then
            fail "$description must be a non-empty relative path without whitespace or control characters, absolute forms, or drive letters"
          fi
          if [[ -z "$value" || "$value" == /* || "$value" == ~* || "$value" == *:* || "$value" == *$' '* ]]; then
            fail "$description must be a non-empty relative path without whitespace or control characters, absolute forms, or drive letters"
          fi
          [[ "$value" == "." ]] && return 0
          case "/$value/" in
            */../*|*/./*)
              fail "$description must not contain traversal or ambiguous dot components"
              ;;
          esac
        }

        validate_compose_file() {
          validate_relative_path "$1" "compose-files entry"
        }

        normalize_workspace_path() {
          local value="$1"
          if [[ "$WORKING_DIRECTORY" == "." ]]; then
            printf '%s' "$value"
          else
            printf '%s/%s' "${WORKING_DIRECTORY%/}" "$value"
          fi
        }

        validate_http_url() {
          local url="$1"
          local authority
          local host
          local port=""

          if [[ "$url" =~ [[:space:][:cntrl:]] ]]; then
            fail "wait-urls entries must be absolute HTTP(S) URLs without whitespace or control characters"
          fi
          if [[ ! "$url" =~ ^https?://([^/?#]+)([/?#].*)?$ ]]; then
            fail "wait-urls entries must be absolute HTTP(S) URLs"
          fi
          authority="${BASH_REMATCH[1]}"

          if [[ "$authority" == \[* ]]; then
            if [[ ! "$authority" =~ ^\[([0-9A-Fa-f:.]+)\](:([0-9]+))?$ ]]; then
              fail "wait-urls entries must be absolute HTTP(S) URLs"
            fi
            host="${BASH_REMATCH[1]}"
            port="${BASH_REMATCH[3]:-}"
            [[ "$host" == *:* ]] || fail "wait-urls entries must be absolute HTTP(S) URLs"
          else
            if [[ ! "$authority" =~ ^([A-Za-z0-9._~-]+)(:([0-9]+))?$ ]]; then
              fail "wait-urls entries must be absolute HTTP(S) URLs"
            fi
            port="${BASH_REMATCH[3]:-}"
          fi

          if [[ -n "$port" ]]; then
            (( ${#port} <= 5 )) || fail "wait-urls entries must be absolute HTTP(S) URLs"
            (( 10#$port > 0 && 10#$port <= 65535 )) || fail "wait-urls entries must be absolute HTTP(S) URLs"
          fi
        }

        requires_linux

        validate_boolean "build" "$BUILD"
        validate_boolean "down-on-timeout" "$DOWN_ON_TIMEOUT"
        validate_boolean "show-logs-on-failure" "$SHOW_LOGS_ON_FAILURE"
        validate_boolean "wait-for-health" "$WAIT_FOR_HEALTH"

        if [[ "$WAIT_FOR_HEALTH" == "false" ]]; then
          fail "wait-for-health=false is unsupported in compose-health-check-action v2.4.0 because it would require a second readiness engine. Set wait-for-health=true and use the standalone engine's built-in health checks."
        fi
        if [[ "$SHOW_LOGS_ON_FAILURE" == "false" ]]; then
          fail "show-logs-on-failure=false is unsupported in compose-health-check-action v2.4.0 because diagnostics ownership is now in the standalone health action. Set show-logs-on-failure=true or disable caller-side cleanup by default."
        fi

        timeout_seconds="$(normalize_positive_int "timeout-seconds" "$TIMEOUT_SECONDS" 86400)"
        url_timeout_seconds="$(normalize_positive_int "url-timeout-seconds" "$URL_TIMEOUT_SECONDS" 300)"

        validate_relative_path "$WORKING_DIRECTORY" "working-directory"

        mapfile -t compose_files < <(printf '%s\n' "$COMPOSE_FILES" | sed '/^[[:space:]]*$/d')
        if (( ${#compose_files[@]} == 0 )); then
          fail "At least one compose file is required"
        fi

        normalized_files=()
        for file in "${compose_files[@]}"; do
          validate_compose_file "$file"

          normalized_files+=("$(normalize_workspace_path "$file")")
        done

        normalized_before_hook=""
        normalized_after_hook=""
        if [[ -n "$BEFORE_COMPOSE_HOOK" ]]; then
          validate_relative_path "$BEFORE_COMPOSE_HOOK" "before-compose-hook"
          normalized_before_hook="$(normalize_workspace_path "$BEFORE_COMPOSE_HOOK")"
        fi
        if [[ -n "$AFTER_HEALTH_HOOK" ]]; then
          validate_relative_path "$AFTER_HEALTH_HOOK" "after-health-hook"
          normalized_after_hook="$(normalize_workspace_path "$AFTER_HEALTH_HOOK")"
        fi

        while IFS= read -r url; do
          [[ -z "$url" ]] && continue
          validate_http_url "$url"
        done <<< "$WAIT_URLS"

        validate_service_name() {
          [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || fail "service names must match ^[A-Za-z0-9][A-Za-z0-9._-]*$: $1"
        }

        validate_profile_name() {
          [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._-]+$ ]] || fail "profile names must match ^[A-Za-z0-9][A-Za-z0-9._-]+$: $1"
        }

        profile_names=()
        IFS=$' \t\r\n' read -r -d '' -a profile_tokens < <(printf '%s\0' "${PROFILES//,/ }")
        for token in "${profile_tokens[@]}"; do
          [[ -z "$token" ]] && continue
          validate_profile_name "$token"
          profile_names+=("$token")
        done
        compose_profiles="${profile_names[*]}"

        compose_services=""
        service_names=()
        explicit_service_count=0
        for source_kind in services completed-services; do
          if [[ "$source_kind" == "services" ]]; then
            source="$SERVICES"
          else
            source="$COMPLETED_SERVICES"
          fi
          IFS=$' \t\r\n' read -r -d '' -a source_tokens < <(printf '%s\0' "${source//,/ }")
          for token in "${source_tokens[@]}"; do
            [[ -z "$token" ]] && continue
            validate_service_name "$token"
            if [[ "$source_kind" == "services" ]]; then
              (( explicit_service_count += 1 ))
            fi
            if (( explicit_service_count > 0 )); then
              already_seen=false
              for existing in "${service_names[@]}"; do
                if [[ "$existing" == "$token" ]]; then
                  already_seen=true
                  break
                fi
              done
              [[ "$already_seen" == "true" ]] || service_names+=("$token")
            fi
          done
        done
        if (( explicit_service_count > 0 )); then
          compose_services="${service_names[*]}"
        fi

        {
          printf 'COMPOSE_FILES_NORMALIZED<<COMPOSE_FILES_EOF\n'
          printf '%s\n' "${normalized_files[@]}"
          printf 'COMPOSE_FILES_EOF\n'
          printf 'COMPOSE_SERVICES_NORMALIZED=%s\n' "$compose_services"
          printf 'COMPOSE_PROFILES_NORMALIZED=%s\n' "$compose_profiles"
          printf 'COMPOSE_BEFORE_HOOK_NORMALIZED=%s\n' "$normalized_before_hook"
          printf 'COMPOSE_AFTER_HOOK_NORMALIZED=%s\n' "$normalized_after_hook"
          printf 'COMPOSE_WORKING_DIRECTORY=%s\n' "$WORKING_DIRECTORY"
          printf 'COMPOSE_TIMEOUT_SECONDS=%s\n' "$timeout_seconds"
          printf 'COMPOSE_URL_TIMEOUT_SECONDS=%s\n' "$url_timeout_seconds"
        } >>"${GITHUB_ENV:?GITHUB_ENV is required}"

    - id: compose-health
      name: Start Compose with standalone health engine
      uses: quokkify/compose-health-check-action@1bd4a5793d977cdd8a14cca7bbfe3544b49bb3e0 # v2.4.0
      with:
        compose-files: ${{ env.COMPOSE_FILES_NORMALIZED }}
        compose-services: ${{ env.COMPOSE_SERVICES_NORMALIZED }}
        compose-profiles: ${{ env.COMPOSE_PROFILES_NORMALIZED }}
        before-compose-hook: ${{ env.COMPOSE_BEFORE_HOOK_NORMALIZED }}
        after-health-hook: ${{ env.COMPOSE_AFTER_HOOK_NORMALIZED }}
        timeout: ${{ env.COMPOSE_TIMEOUT_SECONDS }}
        additional-compose-args: ${{ inputs.build == 'true' && format('{0} --build', inputs.additional-compose-args) || inputs.additional-compose-args }}

    - name: Mark Compose startup complete
      if: ${{ steps.compose-health.outcome == 'success' }}
      shell: bash
      run: echo 'COMPOSE_STARTED=true' >>"${GITHUB_ENV:?GITHUB_ENV is required}"

    - name: Wait for HTTP readiness
      if: ${{ inputs.wait-urls != '' }}
      shell: bash
      env:
        TIMEOUT_SECONDS: ${{ env.COMPOSE_TIMEOUT_SECONDS }}
        URL_TIMEOUT_SECONDS: ${{ env.COMPOSE_URL_TIMEOUT_SECONDS }}
        WAIT_URLS: ${{ inputs.wait-urls }}
      run: |
        set -euo pipefail
        deadline=$((SECONDS + 10#$TIMEOUT_SECONDS))
        url_timeout=$((10#$URL_TIMEOUT_SECONDS))
        while IFS= read -r url; do
          [[ -z "$url" ]] && continue
          ready=false
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            request_timeout=$remaining
            (( request_timeout > url_timeout )) && request_timeout=$url_timeout
            if curl --fail --silent --show-error --location --max-time "$request_timeout" -- "$url" >/dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep_seconds=2
            (( sleep_seconds > remaining )) && sleep_seconds=$remaining
            (( sleep_seconds > 0 )) && sleep "$sleep_seconds"
          done
          if [[ "$ready" != "true" ]]; then
            echo "Timed out waiting for HTTP readiness" >&2
            exit 2
          fi
        done <<< "$WAIT_URLS"

    - name: Optional Compose cleanup after failure
      if: ${{ failure() && inputs.down-on-timeout == 'true' && env.COMPOSE_STARTED == 'true' }}
      shell: bash
      env:
        COMPOSE_FILES: ${{ env.COMPOSE_FILES_NORMALIZED }}
        COMPOSE_PROFILES: ${{ env.COMPOSE_PROFILES_NORMALIZED }}
      run: |
        set -euo pipefail
        mapfile -t compose_files < <(printf '%s\n' "$COMPOSE_FILES" | sed '/^[[:space:]]*$/d')
        compose_args=()
        for file in "${compose_files[@]}"; do
          compose_args+=(--file "$file")
        done
        read -r -a compose_profiles <<<"$COMPOSE_PROFILES"
        for profile in "${compose_profiles[@]}"; do
          compose_args+=(--profile "$profile")
        done
        docker compose "${compose_args[@]}" down || true
